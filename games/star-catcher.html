<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- tells phones to show the page at its real size instead of zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Catcher</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;          /* the part of the screen you can really see (phones) */
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 12px 0 24px;
    }
    /* the game area: as big as fits the screen, always 480 x 600 in shape */
    .stage {
      position: relative;
      width: min(480px, 100vw, calc(92vh * 0.8));
      width: min(480px, 100vw, calc((100dvh - 40px) * 0.8));
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #1d2340;
      border: 3px solid #fff;
      box-sizing: border-box;    /* count the border inside the size, so it fits a phone */
      touch-action: none;        /* dragging a finger moves the paddle, not the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* NEW: the box where you type your name for the top scores */
    .name-form {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(300px, 82%);
      padding: 18px;
      background: #1d2340;
      border: 3px solid #ffd75e;
      border-radius: 8px;
      box-shadow: 6px 6px 0 #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    .name-form .trophy { font-size: 40px; line-height: 1; }
    .name-form h2 { margin: 8px 0 2px; font-size: 22px; color: #ffd75e; }
    .name-form p { margin: 0 0 12px; color: #cfd3ee; }
    .name-form input {
      width: 100%;
      padding: 10px;
      font-size: 20px;
      text-align: center;
      background: #12152b;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .name-form input:focus { outline: none; border-color: #ffd75e; }
    .name-form .name-label { display: block; margin: 10px 0 4px; text-align: left; font-weight: bold; font-size: 14px; color: #cfd3ee; }
    .name-form .name-error { margin: 10px 0 0; color: #ff8fc7; font-weight: bold; }
    .name-form .row { display: flex; gap: 8px; margin-top: 12px; }
    .name-form button {
      flex: 1;
      padding: 10px;
      font: bold 17px sans-serif;
      border-radius: 4px;
      cursor: pointer;
    }
    .name-form .save { background: #ffd75e; color: #1d2340; border: 2px solid #ffd75e; }
    .name-form .skip { background: transparent; color: #fff; border: 2px solid #fff; }
    .hidden { display: none !important; }
    /* link back to the arcade's home page */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      background: #ffd75e;
      color: #1d2340;
      font: bold 15px sans-serif;
      text-decoration: none;
      border-radius: 4px;
    }
    /* phones: game near the top, a little space at the bottom */
    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 8px 0 calc(28px + env(safe-area-inset-bottom));
      }
      .back {
        position: static;
        align-self: flex-start;
        margin: 0 0 8px 10px;
        padding: 5px 10px;
        font-size: 14px;
      }
      .stage {
        width: min(100vw, calc(88vh * 0.8));
        width: min(100vw, calc((100dvh - 90px) * 0.8));
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">&larr; Arcade</a>
  <div class="stage">
    <canvas id="game" width="480" height="600"></canvas>

    <!-- NEW: asks for your name before you play -->
    <form class="name-form hidden" id="name-form" autocomplete="off">
      <div class="trophy">🙂</div>
      <h2>What's your name?</h2>
      <p>It goes on the scoreboard when you get a top score.</p>
      <label class="name-label hidden" id="name-label-1" for="name-input-1">Player 1</label>
      <input id="name-input-1" type="text" maxlength="12" placeholder="Your name" aria-label="Player 1 name" spellcheck="false">
      <label class="name-label hidden" id="name-label-2" for="name-input-2">Player 2</label>
      <input class="hidden" id="name-input-2" type="text" maxlength="12" placeholder="Player 2's name" aria-label="Player 2 name" spellcheck="false">
      <p class="name-error hidden" id="name-error" role="alert"></p>
      <div class="row">
        <button class="save" type="submit" id="name-go">Play ▶</button>
        <button class="skip" type="button" id="name-cancel">Back</button>
      </div>
    </form>
  </div>

  <script>
    // ---------------------------------------------------------------
    // 1. SETUP
    // ---------------------------------------------------------------
    const canvas = document.getElementById("game");
    const pen = canvas.getContext("2d");

    // ---------------------------------------------------------------
    // 2. STATE
    // ---------------------------------------------------------------

    // two paddles. Change the colors to anything you like!
    const players = [
      {
        name: "Player 1",
        color: "black",
        leftKey: "a",
        rightKey: "d",
        x: 190, y: 550, width: 100, height: 20,
        baseWidth: 100,      // NEW: normal size (the mushroom makes it bigger)
        speed: 300,
        score: 0,
        bigTime: 0,          // NEW: seconds of BIG PADDLE left
        doubleTime: 0        // NEW: seconds of DOUBLE POINTS left
      },
      {
        name: "Player 2",
        color: "pink",
        leftKey: "ArrowLeft",
        rightKey: "ArrowRight",
        x: 0, y: 550, width: 100, height: 20,
        baseWidth: 100,
        speed: 300,
        score: 0,
        bigTime: 0,
        doubleTime: 0
      }
    ];
    let playerCount = 1;       // 1 or 2 players

    // NEW: POWER-UPS. Each one has a picture, a message, and how many seconds it lasts.
    const POWER_UPS = {
      life:   { picture: "❤️", message: "+1 LIFE!" },
      big:    { picture: "🍄", message: "BIG PADDLE!",    seconds: 10 },
      magnet: { picture: "🧲", message: "STAR MAGNET!",   seconds: 8 },
      slow:   { picture: "🐢", message: "SLOW MOTION!",   seconds: 6 },
      shield: { picture: "🛡️", message: "SHIELD!",        seconds: 10 },
      double: { picture: "💎", message: "DOUBLE POINTS!", seconds: 10 }
    };

    // game rules. Try changing these numbers!
    const RULES = {
      maxLives: 5,
      bonusEvery: 3,           // a BONUS ROUND at level 3, 6, 9...
      bonusSeconds: 10,
      bonusPoints: 3           // each golden star in a bonus round
    };

    // NEW: DIFFICULTY. Each level of difficulty changes these numbers.
    const DIFFICULTIES = {
      easy: {
        label: "EASY",
        lives: 5,               // hearts at the start
        paddle: 120,            // paddle width
        fallSpeed: 0.75,        // 0.75 = stars fall 25% slower than medium
        speedUpPerLevel: 0.15,  // each level, stars fall 15% faster
        dropEvery: 1.0,         // seconds between falling things at level 1...
        fastestDrop: 0.35,      // ...and the shortest gap it ever gets to
        powerUpChance: 0.12,    // 12% of falling things are power-ups
        bombChance: 0.05,       // 5% are bombs...
        bombsFromLevel: 3       // ...starting at level 3
      },
      medium: {
        label: "MEDIUM",
        lives: 3,
        paddle: 100,
        fallSpeed: 1,
        speedUpPerLevel: 0.25,
        dropEvery: 0.8,
        fastestDrop: 0.25,
        powerUpChance: 0.08,
        bombChance: 0.10,
        bombsFromLevel: 2
      },
      hard: {
        label: "HARD",
        lives: 3,
        paddle: 80,
        fallSpeed: 1.3,
        speedUpPerLevel: 0.25,
        dropEvery: 0.65,
        fastestDrop: 0.2,
        powerUpChance: 0.06,
        bombChance: 0.15,
        bombsFromLevel: 1
      }
    };
    const DIFFICULTY_ORDER = ["easy", "medium", "hard"];
    let difficulty = "medium";
    try {
      const savedDifficulty = localStorage.getItem("starCatcherDifficulty");
      if (DIFFICULTIES[savedDifficulty]) difficulty = savedDifficulty;
    } catch (e) {}

    // the settings for the difficulty that's picked right now
    function settings() { return DIFFICULTIES[difficulty]; }

    function setDifficulty(name) {
      if (!DIFFICULTIES[name] || name === difficulty) return;
      difficulty = name;
      justAdded = [];
      newBest = false;
      onlineNote = "";
      best = board().length ? board()[0].score : 0;
      try { localStorage.setItem("starCatcherDifficulty", difficulty); } catch (e) {}
      sounds.caught();
      loadOnlineScores(name);          // NEW: get the latest scores for this difficulty
    }

    // ← and → step through easy, medium, hard
    function stepDifficulty(direction) {
      const i = DIFFICULTY_ORDER.indexOf(difficulty) + direction;
      if (i >= 0 && i < DIFFICULTY_ORDER.length) setDifficulty(DIFFICULTY_ORDER[i]);
    }

    let falling = [];          // everything falling: stars, power-ups, bombs
    let sparkles = [];         // little bits that fly out when you catch something
    let popups = [];           // NEW: words that float up, like "+3" or "SHIELD!"
    let lives = 3;
    let level = 1;
    let starsCaught = 0;       // NEW: normal stars caught. Every 10 is a new level.
    let gameState = "start";   // "start", "playing", "paused" or "gameover"
    const starPicture = "⭐";
    let spawnTimer = 0;
    let shakeTime = 0;         // how long the screen shakes
    let bannerText = "";       // NEW: big message in the middle ("LEVEL 2!", "BONUS ROUND!")
    let bannerTimer = 0;
    let clock = 0;             // NEW: seconds since the page opened (for blinking and glowing)

    // NEW: power-ups that help everyone (seconds left)
    let magnetTime = 0;
    let slowTime = 0;
    let shieldTime = 0;
    let bonusTime = 0;

    // TOP 3 SCORES with names, one list for each difficulty,
    // saved in the browser so they're still there tomorrow
    let scores = { easy: [], medium: [], hard: [] };   // like [{ name: "Jahan", score: 54 }], best first
    let names = ["", ""];          // the names Player 1 and Player 2 typed last time
    let justAdded = [];            // scores added at the end of the last game (shown in gold)
    let newBest = false;

    function cleanList(list) {
      if (!Array.isArray(list)) return [];
      return list.filter(function (e) { return e && typeof e.score === "number"; }).slice(0, 3);
    }

    try {
      const saved = JSON.parse(localStorage.getItem("starCatcherScores") || "{}");
      for (const name of DIFFICULTY_ORDER) scores[name] = cleanList(saved[name]);
      const savedNames = JSON.parse(localStorage.getItem("starCatcherNames") || "[]");
      if (Array.isArray(savedNames)) names = [savedNames[0] || "", savedNames[1] || ""];
      // scores from older versions of the game go on the medium list
      if (scores.medium.length === 0) {
        scores.medium = cleanList(JSON.parse(localStorage.getItem("starCatcherTop3") || "[]"));
        const oldBest = Number(localStorage.getItem("starCatcherBest")) || 0;
        if (scores.medium.length === 0 && oldBest > 0) scores.medium = [{ name: "???", score: oldBest }];
      }
    } catch (e) {}

    // ---------------------------------------------------------------
    // NEW: THE SHARED ONLINE SCOREBOARD
    // Scores are kept in a free Google Firebase database, so everyone who plays
    // sees the same top 3. If the internet is down, this device's top 3 is shown instead.
    // ---------------------------------------------------------------
    const FIREBASE_PROJECT = "star-catcher-891e9";
    const DATABASE = "projects/" + FIREBASE_PROJECT + "/databases/(default)/documents";
    const DATABASE_URL = "https://firestore.googleapis.com/v1/" + DATABASE;
    const MAX_ONLINE_SCORE = 5000;           // the database refuses anything bigger

    let onlineScores = { easy: null, medium: null, hard: null };   // null = not loaded (yet)
    let lastOnlineCheck = -999;              // when we last asked the database (in game seconds)
    let lastAllCheck = -999;                 // when we last checked all three difficulties
    let checkingScores = false;              // true for a moment after game over
    let onlineNote = "";                     // e.g. "Couldn't reach the online scoreboard"

    // ask the database for the best scores on one difficulty
    async function loadOnlineScores(name) {
      try {
        const response = await fetch(DATABASE_URL + "/leaderboards/" + name + ":runQuery", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ structuredQuery: {
            from: [{ collectionId: "scores" }],
            orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }],
            limit: 6               // a few extra, in case an unkind name has to be skipped
          } })
        });
        if (!response.ok) throw new Error("status " + response.status);
        const rows = await response.json();
        onlineScores[name] = rows
          .filter(function (row) { return row.document && row.document.fields; })
          .map(function (row) {
            const fields = row.document.fields;
            return { name: fields.name ? fields.name.stringValue : "", score: Number(fields.score ? fields.score.integerValue : 0) };
          })
          .filter(function (entry) { return entry.name && isKidFriendly(entry.name); })   // skip unkind names
          .slice(0, 3);
      } catch (error) {
        onlineScores[name] = null;           // fall back to this device's list
      }
      if (name === difficulty) best = board().length ? board()[0].score : 0;
    }

    // send one score to the database
    async function sendOnlineScore(name, playerName, score) {
      if (score > MAX_ONLINE_SCORE) return false;
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try {
        const response = await fetch(DATABASE_URL + ":commit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ writes: [{
            update: {
              name: DATABASE + "/leaderboards/" + name + "/scores/" + id,
              fields: { name: { stringValue: playerName }, score: { integerValue: String(score) } }
            },
            updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
            currentDocument: { exists: false }
          }] })
        });
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    function isOnline() { return onlineScores[difficulty] !== null; }

    // the top 3 for the difficulty that's picked right now: everyone's if we can, this device's if not
    function board() { return isOnline() ? onlineScores[difficulty] : scores[difficulty]; }

    let best = board().length ? board()[0].score : 0;

    function saveLeaderboard() {
      try {
        localStorage.setItem("starCatcherScores", JSON.stringify(scores));
        localStorage.setItem("starCatcherNames", JSON.stringify(names));
      } catch (e) {}
    }

    // is this score good enough for the top 3?
    function madeTopThree(score) {
      const list = board();
      return score > 0 && (list.length < 3 || score > list[list.length - 1].score);
    }

    function insertScore(list, entry) {
      const longer = list.concat([entry]);
      longer.sort(function (a, b) { return b.score - a.score; });
      return longer.slice(0, 3);
    }

    function addScore(name, score) {
      const entry = { name: name, score: score };
      const level = difficulty;
      scores[level] = insertScore(scores[level], entry);       // this device's list
      saveLeaderboard();
      if (onlineScores[level]) {
        onlineScores[level] = insertScore(onlineScores[level], entry);   // show it right away...
        sendOnlineScore(level, name, score).then(function (saved) {      // ...then save it for everyone
          if (!saved) onlineNote = "Couldn't save that score online.";
          loadOnlineScores(level);
        });
      }
      justAdded.push(entry);
      if (board().indexOf(entry) === 0) newBest = true;
      best = board()[0].score;
    }

    // was this score just added? (it stays gold even after the board reloads)
    function isJustAdded(entry) {
      return justAdded.some(function (j) { return j.name === entry.name && j.score === entry.score; });
    }

    // NEW: KID-FRIENDLY NAMES. Names with rude or mean words are turned away.
    // Bits that aren't allowed anywhere in a name:
    const BLOCKED_PARTS = ["fuck", "fuk", "shit", "bitch", "cunt", "dick", "cock", "pussy", "porn", "sex",
      "nazi", "hitler", "penis", "vagina", "boob", "slut", "whore", "bastard", "nigg", "fag", "retard",
      "piss", "wank", "twat", "horny", "nude", "naked", "kkk"];
    // Whole words that aren't allowed (but are fine inside other words, like "glass" or "grape"):
    const BLOCKED_WORDS = ["ass", "arse", "asshole", "rape", "hell", "damn", "crap", "suck", "sucks",
      "stupid", "idiot", "dumb", "loser", "hate", "ugly", "fat", "weirdo"];
    // Normal words that happen to contain a blocked bit:
    const ALLOWED_PARTS = ["peacock", "cockatoo", "cockatiel", "cockroach", "hancock", "hitchcock",
      "shuttlecock", "dickens", "essex", "sussex", "middlesex"];

    function isKidFriendly(name) {
      const lookAlikes = { "0": "o", "1": "i", "3": "e", "4": "a", "5": "s", "7": "t", "8": "b", "@": "a", "$": "s", "!": "i" };
      const spaced = name.replace(/([a-z])([A-Z])/g, "$1 $2")            // "JahanIsDumb" -> "Jahan Is Dumb"
        .toLowerCase()
        .replace(/[0134578@$!]/g, function (c) { return lookAlikes[c]; });   // "5h1t" -> "shit"
      let letters = spaced.replace(/[^a-z]/g, "");                         // "f.u.c.k" -> "fuck"
      for (const ok of ALLOWED_PARTS) letters = letters.split(ok).join("");
      const squashed = letters.replace(/(.)\1+/g, "$1");                   // "fuuuck" -> "fuck"
      for (const part of BLOCKED_PARTS) {
        if (letters.includes(part) || squashed.includes(part)) return false;
      }
      for (const word of spaced.split(/[^a-z]+/)) {
        if (BLOCKED_WORDS.includes(word) || BLOCKED_WORDS.includes(word.replace(/(.)\1+/g, "$1"))) return false;
      }
      return true;
    }

    // ---------------------------------------------------------------
    // NEW: PLAYER NAMES. Asked before your first game, then remembered.
    // ---------------------------------------------------------------
    let nameFormOpen = false;
    let nameFormPlayers = 1;       // how many name boxes are showing (1 or 2)
    let startAfterNames = false;   // start playing once the names are in?

    function nameBox(n) { return document.getElementById("name-input-" + n); }

    function openNameForm(count, thenStart) {
      nameFormOpen = true;
      nameFormPlayers = count;
      startAfterNames = thenStart;
      const two = count === 2;
      document.getElementById("name-label-1").classList.toggle("hidden", !two);
      document.getElementById("name-label-2").classList.toggle("hidden", !two);
      nameBox(2).classList.toggle("hidden", !two);
      nameBox(1).value = names[0];
      nameBox(2).value = names[1];
      document.getElementById("name-go").textContent = thenStart ? "Play ▶" : "Save";
      document.getElementById("name-error").classList.add("hidden");
      document.getElementById("name-form").classList.remove("hidden");
      nameBox(1).focus();
      nameBox(1).select();
    }

    function closeNameForm() {
      nameFormOpen = false;
      document.getElementById("name-form").classList.add("hidden");
    }

    function showNameError(message, n) {
      const error = document.getElementById("name-error");
      error.textContent = message;
      error.classList.remove("hidden");
      nameBox(n).focus();
      nameBox(n).select();
    }

    document.getElementById("name-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const typed = [1, 2].map(function (n) { return nameBox(n).value.replace(/\s+/g, " ").trim().slice(0, 12); });
      for (let i = 0; i < nameFormPlayers; i++) {
        if (!typed[i]) {
          return showNameError(nameFormPlayers === 2 ? "Player " + (i + 1) + " needs a name first." : "Type your name first.", i + 1);
        }
        if (!isKidFriendly(typed[i])) return showNameError("That name isn't kid-friendly. Try another one! 🙂", i + 1);
      }
      names[0] = typed[0];
      if (nameFormPlayers === 2) names[1] = typed[1];
      saveLeaderboard();
      closeNameForm();
      if (startAfterNames) startGame(nameFormPlayers);
    });
    document.getElementById("name-cancel").addEventListener("click", closeNameForm);
    for (const n of [1, 2]) {
      nameBox(n).addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeNameForm();
      });
    }

    // start a game, but ask for names first if we don't know them yet
    function tryStart(count) {
      if (!names[0] || (count === 2 && !names[1])) openNameForm(count, true);
      else startGame(count);
    }

    // the name to show for a player ("Deep"), or "Player 1" if there isn't one
    function displayName(p) {
      const typed = names[players.indexOf(p)];
      return typed || p.name;
    }

    // only the players who are in this game
    function activePlayers() {
      return players.slice(0, playerCount);
    }

    // everyone's points added together
    function teamScore() {
      let total = 0;
      for (const p of activePlayers()) total += p.score;
      return total;
    }

    function startGame(count) {
      playerCount = count;
      fingers = {};
      falling = [];
      sparkles = [];
      popups = [];
      lives = settings().lives;        // NEW: depends on the difficulty
      level = 1;
      starsCaught = 0;
      spawnTimer = 0;
      shakeTime = 0;
      bannerTimer = 0;
      magnetTime = 0;
      slowTime = 0;
      shieldTime = 0;
      bonusTime = 0;
      newBest = false;
      for (const p of players) {
        p.score = 0;
        p.baseWidth = settings().paddle;  // NEW: smaller paddle on hard, bigger on easy
        p.width = p.baseWidth;
        p.bigTime = 0;
        p.doubleTime = 0;
      }

      if (playerCount === 1) {
        players[0].x = (canvas.width - players[0].width) / 2;
      } else {
        players[0].x = canvas.width * 0.25 - players[0].width / 2;
        players[1].x = canvas.width * 0.75 - players[1].width / 2;
      }
      gameState = "playing";
    }

    function endGame() {
      gameState = "gameover";
      sounds.gameOver();
      newBest = false;
      justAdded = [];
      onlineNote = "";
      // best score first
      const finished = activePlayers().slice().sort(function (a, b) { return b.score - a.score; });
      // get the very latest online scores first, so we know who really made the top 3
      checkingScores = true;
      loadOnlineScores(difficulty).then(function () {
        checkingScores = false;
        lastOnlineCheck = clock;
        if (gameState !== "gameover") return;
        if (!isOnline()) onlineNote = "Couldn't reach the online scoreboard.";
        // NEW: top-3 scores are saved under each player's name automatically
        for (const p of finished) {
          if (madeTopThree(p.score)) addScore(displayName(p), p.score);
        }
        if (justAdded.length > 0) sounds.levelUp();
      });
    }

    // ---------------------------------------------------------------
    // SOUND. No sound files needed: the browser makes the beeps itself.
    // ---------------------------------------------------------------
    let audio = null;          // the browser's sound engine
    let soundOn = true;

    // browsers only allow sound after you press a key or click, so we start it then
    function startAudio() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    }

    // play one beep: pitch (higher number = higher note), length in seconds,
    // wave shape ("square", "triangle", "sawtooth", "sine") and a delay
    function beep(pitch, length, shape, delay) {
      if (!audio || !soundOn) return;
      const start = audio.currentTime + (delay || 0);
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = shape || "square";
      tone.frequency.setValueAtTime(pitch, start);
      volume.gain.setValueAtTime(0.12, start);
      volume.gain.exponentialRampToValueAtTime(0.001, start + length);   // fade out
      tone.connect(volume);
      volume.connect(audio.destination);
      tone.start(start);
      tone.stop(start + length);
    }

    const sounds = {
      caught:    function () { beep(440, 0.08); beep(1320, 0.1, "square", 0.06); },
      missed:    function () { beep(140, 0.3, "sawtooth"); },
      levelUp:   function () { beep(523, 0.12, "triangle"); beep(659, 0.12, "triangle", 0.1); beep(784, 0.25, "triangle", 0.2); },
      gameOver:  function () { beep(392, 0.25, "triangle"); beep(330, 0.25, "triangle", 0.25); beep(262, 0.6, "triangle", 0.5); },
      // NEW sounds
      powerUp:   function () { beep(523, 0.08, "triangle"); beep(659, 0.08, "triangle", 0.06); beep(784, 0.08, "triangle", 0.12); beep(1047, 0.2, "triangle", 0.18); },
      boom:      function () { beep(90, 0.5, "sawtooth"); beep(55, 0.7, "square", 0.05); },
      shield:    function () { beep(600, 0.12, "triangle"); beep(900, 0.1, "triangle", 0.05); },
      bonusStar: function () { beep(1320, 0.06); beep(1760, 0.08, "square", 0.04); },
      bonus:     function () {
        const tune = [523, 659, 784, 1047, 784, 1047];
        tune.forEach(function (pitch, i) { beep(pitch, 0.12, "square", i * 0.09); });
      }
    };

    // ---------------------------------------------------------------
    // 3. INPUT
    // ---------------------------------------------------------------
    const keys = {};

    document.addEventListener("keydown", function (event) {
      // NEW: while typing a name, the keys are for the name, not the game
      if (nameFormOpen || checkingScores || event.target.tagName === "INPUT") return;
      keys[event.key] = true;
      if (event.key.startsWith("Arrow") || event.key === " ") event.preventDefault();
      startAudio();

      // on the start or game over screen: 1 or 2 picks the players, Space repeats
      if (gameState === "start" || gameState === "gameover") {
        if (event.key === "1") tryStart(1);
        if (event.key === "2") tryStart(2);
        if (event.key === " ") tryStart(playerCount);
        if (event.key.toLowerCase() === "n") {           // NEW: N changes your name
          event.preventDefault();
          openNameForm(playerCount, false);
        }
        if (event.key === "ArrowLeft") stepDifficulty(-1);     // NEW: pick easy, medium or hard
        if (event.key === "ArrowRight") stepDifficulty(1);
      }

      // P pauses, M turns the sound on and off
      const letter = event.key.toLowerCase();
      if (letter === "p") {
        if (gameState === "playing") gameState = "paused";
        else if (gameState === "paused") gameState = "playing";
      }
      if (letter === "m") soundOn = !soundOn;
    });

    document.addEventListener("keyup", function (event) {
      keys[event.key] = false;
    });

    // ---------------------------------------------------------------
    // TOUCH and MOUSE. Put a finger down and drag: the closest paddle follows it.
    // ---------------------------------------------------------------
    const touchScreen = window.matchMedia("(pointer: coarse)").matches;   // phone or tablet?
    let fingers = {};          // every finger on the screen, and which paddle it's holding

    // the page can shrink the canvas to fit a phone, so turn screen spots into game spots
    function gameSpot(event) {
      const box = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * canvas.width / box.width,
        y: (event.clientY - box.top) * canvas.height / box.height
      };
    }

    function closestPaddle(x) {
      let closest = null;
      for (const p of activePlayers()) {
        const distance = Math.abs(p.x + p.width / 2 - x);
        if (closest === null || distance < Math.abs(closest.x + closest.width / 2 - x)) closest = p;
      }
      return closest;
    }

    // buttons on the start and game over screens
    const buttons = [
      { label: "1 PLAYER",  players: 1, x: 50,  y: 425, width: 180, height: 56 },
      { label: "2 PLAYERS", players: 2, x: 250, y: 425, width: 180, height: 56 }
    ];

    // NEW: the EASY, MEDIUM and HARD buttons
    const difficultyButtons = [
      { name: "easy",   x: 48,  y: 222, width: 120, height: 38 },
      { name: "medium", x: 180, y: 222, width: 120, height: 38 },
      { name: "hard",   x: 312, y: 222, width: 120, height: 38 }
    ];

    // NEW: the "Change name" button under the player buttons
    const changeNameButton = { x: 160, y: 528, width: 160, height: 34 };

    // is the spot inside the box? (the same idea as star-and-paddle collision!)
    function inside(spot, box) {
      return spot.x > box.x && spot.x < box.x + box.width &&
             spot.y > box.y && spot.y < box.y + box.height;
    }

    canvas.addEventListener("pointerdown", function (event) {
      startAudio();
      if (nameFormOpen || checkingScores) return;   // finish typing your name first
      const spot = gameSpot(event);

      if (gameState === "start" || gameState === "gameover") {
        for (const b of difficultyButtons) {
          if (inside(spot, b)) setDifficulty(b.name);
        }
        for (const b of buttons) {
          if (inside(spot, b)) tryStart(b.players);
        }
        if (inside(spot, changeNameButton)) {        // NEW: the "Change name" button
          openNameForm(playerCount, false);
        }
        return;
      }
      if (gameState === "paused") {
        gameState = "playing";       // tap to keep playing
        return;
      }

      fingers[event.pointerId] = { x: spot.x, paddle: closestPaddle(spot.x) };
      canvas.setPointerCapture(event.pointerId);   // keep following even if the finger slides off
    });

    canvas.addEventListener("pointermove", function (event) {
      const finger = fingers[event.pointerId];
      if (finger) finger.x = gameSpot(event).x;
    });

    function liftFinger(event) {
      delete fingers[event.pointerId];
    }
    canvas.addEventListener("pointerup", liftFinger);
    canvas.addEventListener("pointercancel", liftFinger);

    // pause by itself if you switch apps or tabs
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && gameState === "playing") gameState = "paused";
      if (!document.hidden) refreshScoresSoon();     // NEW: back in the app? get the newest scores
    });
    window.addEventListener("focus", refreshScoresSoon);

    function refreshScoresSoon() {
      lastOnlineCheck = -999;
      lastAllCheck = -999;
    }

    // ---------------------------------------------------------------
    // Helper functions
    // ---------------------------------------------------------------

    // NEW: drop something from the sky: usually a star, sometimes a power-up or a bomb
    function spawnThing() {
      const d = settings();
      const levelBoost = d.fallSpeed * (1 + (level - 1) * d.speedUpPerLevel);
      const thing = {
        kind: "star",
        picture: starPicture,
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        size: 32,
        speed: (120 + Math.random() * 120) * levelBoost
      };

      if (bonusTime > 0) {
        // bonus round: only golden stars
        thing.kind = "bonus";
        thing.picture = "🌟";
        thing.size = 36;
      } else {
        const roll = Math.random();
        if (roll < d.powerUpChance) {
          thing.kind = "power";
          thing.power = pickPowerUp();
          thing.picture = POWER_UPS[thing.power].picture;
          thing.size = 36;
          thing.speed = 150;              // power-ups fall gently so you can reach them
        } else if (level >= d.bombsFromLevel && roll < d.powerUpChance + d.bombChance) {
          thing.kind = "bomb";
          thing.picture = "💣";
          thing.size = 34;
        }
      }
      falling.push(thing);
    }

    // pick a random power-up (no extra life if your hearts are already full)
    function pickPowerUp() {
      let choices = Object.keys(POWER_UPS);
      if (lives >= RULES.maxLives) {
        choices = choices.filter(function (name) { return name !== "life"; });
      }
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function touching(thing, paddle) {
      const half = thing.size / 2;
      return thing.x + half > paddle.x &&
             thing.x - half < paddle.x + paddle.width &&
             thing.y + half > paddle.y &&
             thing.y - half < paddle.y + paddle.height;
    }

    // throw out a handful of sparkles in random directions
    function burst(x, y, colors, power) {
      colors = colors || ["#ffd75e", "white"];
      power = power || 320;
      for (let i = 0; i < 60; i++) {
        sparkles.push({
          x: x,
          y: y,
          moveX: (Math.random() - 0.5) * power,
          moveY: (Math.random() - 0.5) * power,
          life: 0.6,                                        // seconds left
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    // NEW: words that float up and fade, like "+3"
    function popup(text, x, y, color) {
      popups.push({ text: text, x: Math.max(90, Math.min(canvas.width - 90, x)), y: y, color: color, life: 1 });
    }

    // NEW: big message in the middle of the screen
    function banner(text) {
      bannerText = text;
      bannerTimer = 1.5;
    }

    // NEW: what happens when a paddle catches something
    function collect(thing, p) {
      thing.gone = true;

      if (thing.kind === "bomb") {
        lives -= 1;
        shakeTime = 0.5;
        burst(thing.x, thing.y, ["#ff6b3d", "#ffd75e", "#888"], 520);
        popup("OUCH!", thing.x, thing.y - 20, "#ff6b6b");
        sounds.boom();
        return;
      }

      if (thing.kind === "power") {
        usePowerUp(thing.power, p);
        burst(thing.x, thing.y, ["#7df9ff", "white"]);
        popup(POWER_UPS[thing.power].message, thing.x, thing.y - 20, "#7df9ff");
        sounds.powerUp();
        return;
      }

      // a star: normal stars are 1 point, golden bonus stars more, and the diamond doubles it
      let points = thing.kind === "bonus" ? RULES.bonusPoints : 1;
      if (p.doubleTime > 0) points = points * 2;
      p.score += points;
      if (thing.kind === "star") starsCaught += 1;
      burst(thing.x, thing.y);
      if (points > 1) popup("+" + points, thing.x, thing.y - 20, "#ffd75e");
      if (thing.kind === "bonus") sounds.bonusStar(); else sounds.caught();
    }

    function usePowerUp(power, p) {
      const seconds = POWER_UPS[power].seconds;
      if (power === "life") lives = Math.min(RULES.maxLives, lives + 1);
      if (power === "big") p.bigTime = seconds;          // only the paddle that caught it
      if (power === "double") p.doubleTime = seconds;    // only the player who caught it
      if (power === "magnet") magnetTime = seconds;      // these help everyone
      if (power === "slow") slowTime = seconds;
      if (power === "shield") shieldTime = seconds;
    }

    // NEW: the bonus round
    function startBonus() {
      bonusTime = RULES.bonusSeconds;
      for (const thing of falling) {
        if (thing.kind === "bomb") {                  // bombs vanish in a puff of smoke
          thing.gone = true;
          burst(thing.x, thing.y, ["#999", "white"]);
        }
      }
      banner("BONUS ROUND!");
      sounds.bonus();
    }

    // ---------------------------------------------------------------
    // 4. UPDATE
    // ---------------------------------------------------------------
    function update(dt) {
      clock += dt;

      // effects keep fading even on the game over screen
      for (const s of sparkles) {
        s.x += s.moveX * dt;
        s.y += s.moveY * dt;
        s.moveY += 400 * dt;          // gravity pulls them down
        s.life -= dt;
      }
      sparkles = sparkles.filter(function (s) { return s.life > 0; });
      for (const word of popups) {
        word.y -= 40 * dt;            // float up
        word.life -= dt;
      }
      popups = popups.filter(function (word) { return word.life > 0; });
      if (shakeTime > 0) shakeTime -= dt;
      if (bannerTimer > 0) bannerTimer -= dt;

      // NEW: keep the scoreboard up to date. Every 10 seconds on the menus, every 30 seconds
      // while playing, and all three difficulties every 30 seconds on the menus.
      const onMenu = gameState === "start" || gameState === "gameover";
      if (!document.hidden && !checkingScores) {
        if (clock - lastOnlineCheck > (onMenu ? 10 : 30)) {
          lastOnlineCheck = clock;
          loadOnlineScores(difficulty);
        }
        if (onMenu && clock - lastAllCheck > 30) {
          lastAllCheck = clock;
          for (const name of DIFFICULTY_ORDER) {
            if (name !== difficulty) loadOnlineScores(name);
          }
        }
      }

      if (gameState !== "playing") return;

      // NEW: power-up timers count down
      magnetTime = Math.max(0, magnetTime - dt);
      slowTime = Math.max(0, slowTime - dt);
      shieldTime = Math.max(0, shieldTime - dt);
      for (const p of players) {
        p.bigTime = Math.max(0, p.bigTime - dt);
        p.doubleTime = Math.max(0, p.doubleTime - dt);
      }
      if (bonusTime > 0) {
        bonusTime -= dt;
        if (bonusTime <= 0) {
          bonusTime = 0;
          banner("BONUS OVER!");
        }
      }

      for (const p of activePlayers()) {
        // NEW: grow or shrink smoothly, staying centered
        const targetWidth = p.bigTime > 0 ? p.baseWidth * 1.8 : p.baseWidth;
        const center = p.x + p.width / 2;
        p.width += (targetWidth - p.width) * Math.min(1, dt * 8);
        p.x = center - p.width / 2;
      }

      // each finger pulls its paddle to where the finger is
      for (const id in fingers) {
        const finger = fingers[id];
        finger.paddle.x = finger.x - finger.paddle.width / 2;
      }

      // move each paddle with its own keys
      for (const p of activePlayers()) {
        let left = keys[p.leftKey];
        let right = keys[p.rightKey];
        if (playerCount === 1) {            // playing alone? both sets of keys work
          left = keys["a"] || keys["ArrowLeft"];
          right = keys["d"] || keys["ArrowRight"];
        }
        if (left) p.x -= p.speed * dt;
        if (right) p.x += p.speed * dt;

        if (p.x < 0) p.x = 0;
        if (p.x > canvas.width - p.width) p.x = canvas.width - p.width;
      }

      // NEW: every 10 normal stars is a new level, and some levels start a bonus round
      const newLevel = 1 + Math.floor(starsCaught / 10);
      if (newLevel > level) {
        level = newLevel;
        if (level % RULES.bonusEvery === 0) {
          startBonus();
        } else {
          banner("LEVEL " + level + "!");
          sounds.levelUp();
        }
      }

      // things drop faster in a bonus round
      const d = settings();
      const spawnEvery = bonusTime > 0 ? 0.22 : Math.max(d.fastestDrop, d.dropEvery - (level - 1) * 0.1);
      spawnTimer += dt;
      if (spawnTimer >= spawnEvery) {
        spawnTimer = 0;
        spawnThing();
      }

      const slowDown = slowTime > 0 ? 0.5 : 1;     // the turtle makes everything fall at half speed

      for (const thing of falling) {
        thing.y += thing.speed * slowDown * dt;

        // the magnet pulls good things sideways toward the closest paddle (never bombs!)
        if (magnetTime > 0 && thing.kind !== "bomb") {
          const p = closestPaddle(thing.x);
          const pull = 220 * dt;
          const gap = p.x + p.width / 2 - thing.x;
          thing.x += Math.max(-pull, Math.min(pull, gap));
        }

        for (const p of activePlayers()) {
          if (!thing.gone && touching(thing, p)) collect(thing, p);
        }

        // the shield catches stars just before they hit the ground
        if (!thing.gone && shieldTime > 0 && thing.kind === "star" && thing.y > canvas.height - 28) {
          thing.gone = true;
          burst(thing.x, canvas.height - 28, ["#7df9ff", "white"]);
          sounds.shield();
        }

        if (!thing.gone && thing.y > canvas.height + thing.size) {
          thing.gone = true;
          if (thing.kind === "star") {           // only missing a normal star costs a life
            lives -= 1;
            shakeTime = 0.25;
            sounds.missed();
          }
        }
      }

      falling = falling.filter(function (thing) { return !thing.gone; });

      if (lives <= 0) {
        lives = 0;
        endGame();
      }
    }

    // ---------------------------------------------------------------
    // 5. DRAW
    // ---------------------------------------------------------------
    // draw the 1 PLAYER and 2 PLAYERS buttons
    function drawButtons() {
      for (const b of buttons) {
        pen.fillStyle = "#ffd75e";
        pen.fillRect(b.x, b.y, b.width, b.height);
        pen.fillStyle = "#1d2340";
        pen.font = "bold 20px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.fillText(b.label, b.x + b.width / 2, b.y + b.height / 2);
      }
    }

    function drawMessage(title, lines, prompt) {
      pen.fillStyle = "rgba(0, 0, 0, 0.65)";
      pen.fillRect(0, 0, canvas.width, canvas.height);

      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = "bold 44px sans-serif";
      pen.fillText(title, canvas.width / 2, canvas.height / 2 - 90);

      pen.font = "19px sans-serif";
      for (let i = 0; i < lines.length; i++) {
        pen.fillText(lines[i], canvas.width / 2, canvas.height / 2 - 30 + i * 32);
      }

      pen.fillStyle = "#ffd75e";
      pen.font = "bold 19px sans-serif";
      pen.fillText(prompt, canvas.width / 2, canvas.height / 2 + 100);
    }

    // NEW: a little guide to the power-ups on the start screen
    function drawPowerUpGuide() {
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.font = "14px sans-serif";
      pen.fillStyle = "#cfd3ee";
      pen.fillText("❤️ extra life    🍄 big paddle    🧲 star magnet", canvas.width / 2, 72);
      pen.fillText("🐢 slow motion    🛡️ shield    💎 double points", canvas.width / 2, 94);
      pen.fillText("Dodge 💣 bombs!   🌟 Bonus round every 3 levels", canvas.width / 2, 116);
    }

    // NEW: EASY / MEDIUM / HARD buttons (the picked one is yellow)
    function drawDifficultyButtons() {
      for (const b of difficultyButtons) {
        const picked = b.name === difficulty;
        pen.fillStyle = picked ? "#ffd75e" : "rgba(255, 255, 255, 0.08)";
        pen.fillRect(b.x, b.y, b.width, b.height);
        pen.strokeStyle = picked ? "#ffd75e" : "#8a8fb0";
        pen.lineWidth = 2;
        pen.strokeRect(b.x, b.y, b.width, b.height);
        pen.fillStyle = picked ? "#1d2340" : "white";
        pen.font = "bold 17px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.fillText(DIFFICULTIES[b.name].label, b.x + b.width / 2, b.y + b.height / 2 + 1);
      }
    }

    // the top 3 scores with medals, for the difficulty that's picked
    function drawLeaderboard(top) {
      pen.textBaseline = "middle";
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = "bold 17px sans-serif";
      // 🌍 = everyone's scores, 📱 = only this device (when the internet is down)
      pen.fillText((isOnline() ? "🌍 WORLD TOP 3 · " : "📱 TOP 3 ON THIS DEVICE · ") + settings().label, canvas.width / 2, top);

      const medals = ["🥇", "🥈", "🥉"];
      for (let i = 0; i < 3; i++) {
        const entry = board()[i];
        const y = top + 28 + i * 24;
        const isNew = entry && isJustAdded(entry);
        pen.font = (isNew ? "bold " : "") + "18px sans-serif";
        pen.fillStyle = isNew ? "#ffd75e" : (entry ? "white" : "#8a8fb0");
        pen.textAlign = "left";
        // a name that isn't kid-friendly is never shown, even if it got saved somehow
        const shownName = entry ? (isKidFriendly(entry.name) ? entry.name : "★★★") : "-----";
        pen.fillText(medals[i] + "  " + shownName, 125, y);
        pen.textAlign = "right";
        pen.fillText(entry ? String(entry.score) : "", 355, y);
      }
    }

    // NEW: the #1 score on the other two difficulties, e.g. "EASY: Jahan 54 · HARD: —"
    function drawOtherBests(y) {
      const parts = [];
      for (const name of DIFFICULTY_ORDER) {
        if (name === difficulty) continue;
        const list = onlineScores[name] || scores[name];
        const top = list[0];
        parts.push(DIFFICULTIES[name].label + ": " + (top && isKidFriendly(top.name) ? top.name + " " + top.score : "—"));
      }
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "#aab";
      pen.font = "13px sans-serif";
      pen.fillText("#1 on " + parts.join("   ·   "), canvas.width / 2, y);
    }

    function dimScreen() {
      pen.fillStyle = "rgba(0, 0, 0, 0.7)";
      pen.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawStartScreen() {
      dimScreen();
      drawPowerUpGuide();
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = "bold 44px sans-serif";
      pen.fillText("STAR CATCHER", canvas.width / 2, 160);
      pen.font = "18px sans-serif";
      pen.fillText("Catch ⭐, grab power-ups, dodge 💣!", canvas.width / 2, 198);
      drawDifficultyButtons();
      drawLeaderboard(290);
      drawOtherBests(386);
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = "bold 19px sans-serif";
      pen.fillText("How many players?", canvas.width / 2, 408);
      drawButtons();
      drawPlayingAs();
    }

    // NEW: "Playing as Deep" and a button to change it
    function drawPlayingAs() {
      if (!names[0]) return;           // no name yet: we'll ask when you press play
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = "16px sans-serif";
      const who = playerCount === 2 && names[1] ? names[0] + " & " + names[1] : names[0];
      pen.fillText("👤 Playing as " + who, canvas.width / 2, 506);
      const b = changeNameButton;
      pen.strokeStyle = "#8a8fb0";
      pen.lineWidth = 2;
      pen.strokeRect(b.x, b.y, b.width, b.height);
      pen.fillStyle = "#cfd3ee";
      pen.font = "bold 15px sans-serif";
      pen.fillText("✏️ Change name", b.x + b.width / 2, b.y + b.height / 2 + 1);
    }

    function drawGameOverScreen() {
      dimScreen();
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = "bold 44px sans-serif";
      pen.fillText("GAME OVER", canvas.width / 2, 128);
      pen.font = "20px sans-serif";
      pen.fillText(resultText(), canvas.width / 2, 168);
      if (justAdded.length > 0) {
        // NEW: say who made it, e.g. "Deep made the top 3!"
        const who = justAdded.map(function (e) { return e.name; }).join(" & ");
        pen.fillStyle = "#ffd75e";
        pen.font = "bold 20px sans-serif";
        pen.fillText(newBest ? "🏆 NEW HIGH SCORE, " + justAdded[0].name + "!" : "🏆 " + who + " made the top 3!", canvas.width / 2, 196);
      }
      drawDifficultyButtons();
      drawLeaderboard(290);
      if (onlineNote) {
        pen.textAlign = "center";
        pen.fillStyle = "#ff8fc7";
        pen.font = "13px sans-serif";
        pen.fillText(onlineNote + " Saved on this device.", canvas.width / 2, 386);
      } else {
        drawOtherBests(386);
      }
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = "bold 19px sans-serif";
      if (checkingScores) {
        pen.fillText("Checking the scoreboard…", canvas.width / 2, 408);
      } else {
        pen.fillText("Play again?", canvas.width / 2, 408);
        drawButtons();
        drawPlayingAs();
      }
    }

    // a paddle with a white outline, so even a black paddle shows up
    function drawPaddle(p) {
      pen.fillStyle = p.color;
      pen.fillRect(p.x, p.y, p.width, p.height);
      pen.strokeStyle = p.doubleTime > 0 ? "#ffd75e" : "white";   // gold outline = double points
      pen.lineWidth = p.doubleTime > 0 ? 4 : 2;
      pen.strokeRect(p.x, p.y, p.width, p.height);

      let label = playerCount === 2 ? (p.name === "Player 1" ? "P1" : "P2") : "";
      if (p.doubleTime > 0) label += (label ? " " : "") + "x2";
      if (label) {
        pen.fillStyle = p.doubleTime > 0 ? "#ffd75e" : "white";
        pen.font = "bold 12px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "bottom";
        pen.fillText(label, p.x + p.width / 2, p.y - 4);
      }
    }

    function drawScore(p, y) {
      pen.fillStyle = p.color;
      pen.fillRect(16, y, 16, 16);
      pen.strokeStyle = "white";
      pen.lineWidth = 2;
      pen.strokeRect(16, y, 16, 16);
      pen.fillStyle = "white";
      pen.font = "bold 20px sans-serif";
      pen.textAlign = "left";
      pen.textBaseline = "top";
      pen.fillText(displayName(p) + ": " + p.score, 40, y - 2);
    }

    // NEW: the power-ups that are on right now, with seconds left
    function drawActivePowerUps() {
      const active = [];
      if (magnetTime > 0) active.push("🧲" + Math.ceil(magnetTime));
      if (slowTime > 0) active.push("🐢" + Math.ceil(slowTime));
      if (shieldTime > 0) active.push("🛡️" + Math.ceil(shieldTime));
      for (const p of activePlayers()) {
        const who = playerCount === 2 ? (p.name === "Player 1" ? "P1" : "P2") : "";
        if (p.bigTime > 0) active.push(who + "🍄" + Math.ceil(p.bigTime));
        if (p.doubleTime > 0) active.push(who + "💎" + Math.ceil(p.doubleTime));
      }
      if (active.length === 0) return;
      pen.fillStyle = "#7df9ff";
      pen.font = "bold 15px sans-serif";
      pen.textAlign = "center";
      pen.textBaseline = "top";
      pen.fillText(active.join("   "), canvas.width / 2 + 40, 44);
    }

    function draw() {
      pen.clearRect(0, 0, canvas.width, canvas.height);

      // NEW: a golden glow during the bonus round
      if (bonusTime > 0) {
        pen.fillStyle = "rgba(255, 200, 60, " + (0.10 + 0.05 * Math.sin(clock * 6)) + ")";
        pen.fillRect(0, 0, canvas.width, canvas.height);
      }

      // --- the game world (this part shakes) ---
      pen.save();
      if (shakeTime > 0) {
        pen.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
      }

      // NEW: the shield is a glowing line near the ground (it blinks when it's about to run out)
      if (shieldTime > 0 && (shieldTime > 2 || Math.sin(clock * 20) > 0)) {
        pen.fillStyle = "rgba(125, 249, 255, " + (0.6 + 0.3 * Math.sin(clock * 10)) + ")";
        pen.fillRect(0, canvas.height - 28, canvas.width, 5);
      }

      pen.textAlign = "center";
      pen.textBaseline = "middle";
      for (const thing of falling) {
        if (thing.kind === "power") {
          // a glowing bubble so power-ups stand out
          pen.fillStyle = "rgba(125, 249, 255, " + (0.25 + 0.15 * Math.sin(clock * 8)) + ")";
          pen.beginPath();
          pen.arc(thing.x, thing.y, thing.size * 0.75, 0, Math.PI * 2);
          pen.fill();
        }
        pen.font = thing.size + "px sans-serif";
        pen.fillText(thing.picture, thing.x, thing.y);
      }

      for (const s of sparkles) {
        pen.globalAlpha = s.life / 0.6;     // fade out as life runs down
        pen.fillStyle = s.color;
        pen.fillRect(s.x - 2, s.y - 2, 4, 4);
      }
      pen.globalAlpha = 1;

      // paddles only during a game (the menus use that space for buttons)
      if (gameState === "playing" || gameState === "paused") {
        for (const p of activePlayers()) drawPaddle(p);
      }

      // floating words
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.font = "bold 20px sans-serif";
      for (const word of popups) {
        pen.globalAlpha = Math.max(0, word.life);
        pen.fillStyle = word.color;
        pen.fillText(word.text, word.x, word.y);
      }
      pen.globalAlpha = 1;
      pen.restore();

      // --- the scoreboard (this part stays still) ---
      drawScore(players[0], 16);
      if (playerCount === 2) drawScore(players[1], 44);

      pen.font = "bold 20px sans-serif";
      pen.textAlign = "center";
      pen.textBaseline = "top";
      if (bonusTime > 0) {
        pen.fillStyle = "#ffd75e";
        pen.fillText("BONUS " + Math.ceil(bonusTime), canvas.width / 2 + 40, 14);
      } else {
        pen.fillStyle = "white";
        pen.fillText("Level " + level, canvas.width / 2 + 40, 14);
      }
      pen.textAlign = "right";
      pen.fillText("❤️".repeat(lives), canvas.width - 16, 14);
      pen.font = "14px sans-serif";
      pen.fillStyle = "#aab";
      pen.fillText(settings().label + " · Best " + best, canvas.width - 16, 44);

      drawActivePowerUps();

      // controls reminder
      pen.font = "14px sans-serif";
      pen.fillStyle = "#aab";
      pen.textAlign = "center";
      pen.textBaseline = "bottom";
      if (touchScreen) {
        pen.fillText("Drag your paddle with a finger", canvas.width / 2, canvas.height - 6);
      } else if (gameState === "start" || gameState === "gameover") {
        pen.fillText("← → difficulty    1 / 2: players    N: change name", canvas.width / 2, canvas.height - 6);
      } else {
        pen.fillText(
          (playerCount === 2 ? "P1: A / D    P2: ← →" : "← → or A / D, or drag") +
          "    P: pause    M: sound " + (soundOn ? "on" : "off"),
          canvas.width / 2, canvas.height - 6
        );
      }

      // big message that fades away ("LEVEL 2!", "BONUS ROUND!")
      if (bannerTimer > 0) {
        pen.globalAlpha = Math.min(1, bannerTimer);
        pen.fillStyle = "#ffd75e";
        pen.font = "bold 44px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.fillText(bannerText, canvas.width / 2, canvas.height / 2);
        pen.globalAlpha = 1;
      }

      // screens for each game state
      if (gameState === "start") drawStartScreen();
      if (gameState === "paused") {
        drawMessage("PAUSED", ["Take a breather."], touchScreen ? "Tap to keep playing" : "Press P or click to keep playing");
      }
      if (gameState === "gameover") drawGameOverScreen();
    }

    // who won?
    function resultText() {
      if (playerCount === 1) return "You scored " + players[0].score + " points";
      const p1 = players[0].score;
      const p2 = players[1].score;
      if (p1 > p2) return displayName(players[0]) + " wins, " + p1 + " to " + p2 + "!";
      if (p2 > p1) return displayName(players[1]) + " wins, " + p2 + " to " + p1 + "!";
      return "It's a tie, " + p1 + " to " + p2 + "!";
    }

    // ---------------------------------------------------------------
    // 6. GAME LOOP
    // ---------------------------------------------------------------
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // NEW: fetch everyone's top scores for all three difficulties
    for (const name of DIFFICULTY_ORDER) loadOnlineScores(name);
    lastOnlineCheck = 0;
    lastAllCheck = 0;

    requestAnimationFrame(loop);
  </script>
</body>
</html>
