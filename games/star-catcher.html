<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- tells phones to show the page at its real size instead of zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Catcher</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #1d2340;
      border: 3px solid #fff;
      max-width: 100%;
      max-height: 95vh;
      box-sizing: border-box;    /* count the border inside the size, so it fits a phone */
      touch-action: none;        /* dragging a finger moves the paddle, not the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* link back to the arcade's home page */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      background: #ffd75e;
      color: #1d2340;
      font: bold 15px sans-serif;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">&larr; Arcade</a>
  <canvas id="game" width="480" height="600"></canvas>

  <script>
    // ---------------------------------------------------------------
    // 1. SETUP
    // ---------------------------------------------------------------
    const canvas = document.getElementById("game");
    const pen = canvas.getContext("2d");

    // ---------------------------------------------------------------
    // 2. STATE
    // ---------------------------------------------------------------

    // two paddles. Change the colors to anything you like!
    const players = [
      {
        name: "Player 1",
        color: "black",
        leftKey: "a",
        rightKey: "d",
        x: 190, y: 550, width: 100, height: 20,
        baseWidth: 100,      // NEW: normal size (the mushroom makes it bigger)
        speed: 300,
        score: 0,
        bigTime: 0,          // NEW: seconds of BIG PADDLE left
        doubleTime: 0        // NEW: seconds of DOUBLE POINTS left
      },
      {
        name: "Player 2",
        color: "pink",
        leftKey: "ArrowLeft",
        rightKey: "ArrowRight",
        x: 0, y: 550, width: 100, height: 20,
        baseWidth: 100,
        speed: 300,
        score: 0,
        bigTime: 0,
        doubleTime: 0
      }
    ];
    let playerCount = 1;       // 1 or 2 players

    // NEW: POWER-UPS. Each one has a picture, a message, and how many seconds it lasts.
    const POWER_UPS = {
      life:   { picture: "❤️", message: "+1 LIFE!" },
      big:    { picture: "🍄", message: "BIG PADDLE!",    seconds: 10 },
      magnet: { picture: "🧲", message: "STAR MAGNET!",   seconds: 8 },
      slow:   { picture: "🐢", message: "SLOW MOTION!",   seconds: 6 },
      shield: { picture: "🛡️", message: "SHIELD!",        seconds: 10 },
      double: { picture: "💎", message: "DOUBLE POINTS!", seconds: 10 }
    };

    // NEW: game rules. Try changing these numbers!
    const RULES = {
      powerUpChance: 0.08,     // 8% of falling things are power-ups
      bombChance: 0.10,        // 10% are bombs...
      bombsFromLevel: 2,       // ...starting at level 2
      maxLives: 5,
      bonusEvery: 3,           // a BONUS ROUND at level 3, 6, 9...
      bonusSeconds: 10,
      bonusPoints: 3           // each golden star in a bonus round
    };

    let falling = [];          // everything falling: stars, power-ups, bombs
    let sparkles = [];         // little bits that fly out when you catch something
    let popups = [];           // NEW: words that float up, like "+3" or "SHIELD!"
    let lives = 3;
    let level = 1;
    let starsCaught = 0;       // NEW: normal stars caught. Every 10 is a new level.
    let gameState = "start";   // "start", "playing", "paused" or "gameover"
    const starPicture = "⭐";
    let spawnTimer = 0;
    let shakeTime = 0;         // how long the screen shakes
    let bannerText = "";       // NEW: big message in the middle ("LEVEL 2!", "BONUS ROUND!")
    let bannerTimer = 0;
    let clock = 0;             // NEW: seconds since the page opened (for blinking and glowing)

    // NEW: power-ups that help everyone (seconds left)
    let magnetTime = 0;
    let slowTime = 0;
    let shieldTime = 0;
    let bonusTime = 0;

    // the best score, saved in the browser so it's still there tomorrow
    let best = 0;
    let newBest = false;
    try { best = Number(localStorage.getItem("starCatcherBest")) || 0; } catch (e) {}

    function saveBest() {
      try { localStorage.setItem("starCatcherBest", best); } catch (e) {}
    }

    // only the players who are in this game
    function activePlayers() {
      return players.slice(0, playerCount);
    }

    // everyone's points added together
    function teamScore() {
      let total = 0;
      for (const p of activePlayers()) total += p.score;
      return total;
    }

    function startGame(count) {
      playerCount = count;
      fingers = {};
      falling = [];
      sparkles = [];
      popups = [];
      lives = 3;
      level = 1;
      starsCaught = 0;
      spawnTimer = 0;
      shakeTime = 0;
      bannerTimer = 0;
      magnetTime = 0;
      slowTime = 0;
      shieldTime = 0;
      bonusTime = 0;
      newBest = false;
      for (const p of players) {
        p.score = 0;
        p.width = p.baseWidth;
        p.bigTime = 0;
        p.doubleTime = 0;
      }

      if (playerCount === 1) {
        players[0].x = (canvas.width - players[0].width) / 2;
      } else {
        players[0].x = canvas.width * 0.25 - players[0].width / 2;
        players[1].x = canvas.width * 0.75 - players[1].width / 2;
      }
      gameState = "playing";
    }

    function endGame() {
      gameState = "gameover";
      sounds.gameOver();
      if (teamScore() > best) {
        best = teamScore();
        newBest = true;
        saveBest();
      }
    }

    // ---------------------------------------------------------------
    // SOUND. No sound files needed: the browser makes the beeps itself.
    // ---------------------------------------------------------------
    let audio = null;          // the browser's sound engine
    let soundOn = true;

    // browsers only allow sound after you press a key or click, so we start it then
    function startAudio() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    }

    // play one beep: pitch (higher number = higher note), length in seconds,
    // wave shape ("square", "triangle", "sawtooth", "sine") and a delay
    function beep(pitch, length, shape, delay) {
      if (!audio || !soundOn) return;
      const start = audio.currentTime + (delay || 0);
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = shape || "square";
      tone.frequency.setValueAtTime(pitch, start);
      volume.gain.setValueAtTime(0.12, start);
      volume.gain.exponentialRampToValueAtTime(0.001, start + length);   // fade out
      tone.connect(volume);
      volume.connect(audio.destination);
      tone.start(start);
      tone.stop(start + length);
    }

    const sounds = {
      caught:    function () { beep(440, 0.08); beep(1320, 0.1, "square", 0.06); },
      missed:    function () { beep(140, 0.3, "sawtooth"); },
      levelUp:   function () { beep(523, 0.12, "triangle"); beep(659, 0.12, "triangle", 0.1); beep(784, 0.25, "triangle", 0.2); },
      gameOver:  function () { beep(392, 0.25, "triangle"); beep(330, 0.25, "triangle", 0.25); beep(262, 0.6, "triangle", 0.5); },
      // NEW sounds
      powerUp:   function () { beep(523, 0.08, "triangle"); beep(659, 0.08, "triangle", 0.06); beep(784, 0.08, "triangle", 0.12); beep(1047, 0.2, "triangle", 0.18); },
      boom:      function () { beep(90, 0.5, "sawtooth"); beep(55, 0.7, "square", 0.05); },
      shield:    function () { beep(600, 0.12, "triangle"); beep(900, 0.1, "triangle", 0.05); },
      bonusStar: function () { beep(1320, 0.06); beep(1760, 0.08, "square", 0.04); },
      bonus:     function () {
        const tune = [523, 659, 784, 1047, 784, 1047];
        tune.forEach(function (pitch, i) { beep(pitch, 0.12, "square", i * 0.09); });
      }
    };

    // ---------------------------------------------------------------
    // 3. INPUT
    // ---------------------------------------------------------------
    const keys = {};

    document.addEventListener("keydown", function (event) {
      keys[event.key] = true;
      if (event.key.startsWith("Arrow") || event.key === " ") event.preventDefault();
      startAudio();

      // on the start or game over screen: 1 or 2 picks the players, Space repeats
      if (gameState === "start" || gameState === "gameover") {
        if (event.key === "1") startGame(1);
        if (event.key === "2") startGame(2);
        if (event.key === " ") startGame(playerCount);
      }

      // P pauses, M turns the sound on and off
      const letter = event.key.toLowerCase();
      if (letter === "p") {
        if (gameState === "playing") gameState = "paused";
        else if (gameState === "paused") gameState = "playing";
      }
      if (letter === "m") soundOn = !soundOn;
    });

    document.addEventListener("keyup", function (event) {
      keys[event.key] = false;
    });

    // ---------------------------------------------------------------
    // TOUCH and MOUSE. Put a finger down and drag: the closest paddle follows it.
    // ---------------------------------------------------------------
    const touchScreen = window.matchMedia("(pointer: coarse)").matches;   // phone or tablet?
    let fingers = {};          // every finger on the screen, and which paddle it's holding

    // the page can shrink the canvas to fit a phone, so turn screen spots into game spots
    function gameSpot(event) {
      const box = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * canvas.width / box.width,
        y: (event.clientY - box.top) * canvas.height / box.height
      };
    }

    function closestPaddle(x) {
      let closest = null;
      for (const p of activePlayers()) {
        const distance = Math.abs(p.x + p.width / 2 - x);
        if (closest === null || distance < Math.abs(closest.x + closest.width / 2 - x)) closest = p;
      }
      return closest;
    }

    // buttons on the start and game over screens
    const buttons = [
      { label: "1 PLAYER",  players: 1, x: 50,  y: 425, width: 180, height: 56 },
      { label: "2 PLAYERS", players: 2, x: 250, y: 425, width: 180, height: 56 }
    ];

    // is the spot inside the box? (the same idea as star-and-paddle collision!)
    function inside(spot, box) {
      return spot.x > box.x && spot.x < box.x + box.width &&
             spot.y > box.y && spot.y < box.y + box.height;
    }

    canvas.addEventListener("pointerdown", function (event) {
      startAudio();
      const spot = gameSpot(event);

      if (gameState === "start" || gameState === "gameover") {
        for (const b of buttons) {
          if (inside(spot, b)) startGame(b.players);
        }
        return;
      }
      if (gameState === "paused") {
        gameState = "playing";       // tap to keep playing
        return;
      }

      fingers[event.pointerId] = { x: spot.x, paddle: closestPaddle(spot.x) };
      canvas.setPointerCapture(event.pointerId);   // keep following even if the finger slides off
    });

    canvas.addEventListener("pointermove", function (event) {
      const finger = fingers[event.pointerId];
      if (finger) finger.x = gameSpot(event).x;
    });

    function liftFinger(event) {
      delete fingers[event.pointerId];
    }
    canvas.addEventListener("pointerup", liftFinger);
    canvas.addEventListener("pointercancel", liftFinger);

    // pause by itself if you switch apps or tabs
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && gameState === "playing") gameState = "paused";
    });

    // ---------------------------------------------------------------
    // Helper functions
    // ---------------------------------------------------------------

    // NEW: drop something from the sky: usually a star, sometimes a power-up or a bomb
    function spawnThing() {
      const levelBoost = 1 + (level - 1) * 0.25;
      const thing = {
        kind: "star",
        picture: starPicture,
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        size: 32,
        speed: (120 + Math.random() * 120) * levelBoost
      };

      if (bonusTime > 0) {
        // bonus round: only golden stars
        thing.kind = "bonus";
        thing.picture = "🌟";
        thing.size = 36;
      } else {
        const roll = Math.random();
        if (roll < RULES.powerUpChance) {
          thing.kind = "power";
          thing.power = pickPowerUp();
          thing.picture = POWER_UPS[thing.power].picture;
          thing.size = 36;
          thing.speed = 150;              // power-ups fall gently so you can reach them
        } else if (level >= RULES.bombsFromLevel && roll < RULES.powerUpChance + RULES.bombChance) {
          thing.kind = "bomb";
          thing.picture = "💣";
          thing.size = 34;
        }
      }
      falling.push(thing);
    }

    // pick a random power-up (no extra life if your hearts are already full)
    function pickPowerUp() {
      let choices = Object.keys(POWER_UPS);
      if (lives >= RULES.maxLives) {
        choices = choices.filter(function (name) { return name !== "life"; });
      }
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function touching(thing, paddle) {
      const half = thing.size / 2;
      return thing.x + half > paddle.x &&
             thing.x - half < paddle.x + paddle.width &&
             thing.y + half > paddle.y &&
             thing.y - half < paddle.y + paddle.height;
    }

    // throw out a handful of sparkles in random directions
    function burst(x, y, colors, power) {
      colors = colors || ["#ffd75e", "white"];
      power = power || 320;
      for (let i = 0; i < 60; i++) {
        sparkles.push({
          x: x,
          y: y,
          moveX: (Math.random() - 0.5) * power,
          moveY: (Math.random() - 0.5) * power,
          life: 0.6,                                        // seconds left
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    // NEW: words that float up and fade, like "+3"
    function popup(text, x, y, color) {
      popups.push({ text: text, x: Math.max(90, Math.min(canvas.width - 90, x)), y: y, color: color, life: 1 });
    }

    // NEW: big message in the middle of the screen
    function banner(text) {
      bannerText = text;
      bannerTimer = 1.5;
    }

    // NEW: what happens when a paddle catches something
    function collect(thing, p) {
      thing.gone = true;

      if (thing.kind === "bomb") {
        lives -= 1;
        shakeTime = 0.5;
        burst(thing.x, thing.y, ["#ff6b3d", "#ffd75e", "#888"], 520);
        popup("OUCH!", thing.x, thing.y - 20, "#ff6b6b");
        sounds.boom();
        return;
      }

      if (thing.kind === "power") {
        usePowerUp(thing.power, p);
        burst(thing.x, thing.y, ["#7df9ff", "white"]);
        popup(POWER_UPS[thing.power].message, thing.x, thing.y - 20, "#7df9ff");
        sounds.powerUp();
        return;
      }

      // a star: normal stars are 1 point, golden bonus stars more, and the diamond doubles it
      let points = thing.kind === "bonus" ? RULES.bonusPoints : 1;
      if (p.doubleTime > 0) points = points * 2;
      p.score += points;
      if (thing.kind === "star") starsCaught += 1;
      burst(thing.x, thing.y);
      if (points > 1) popup("+" + points, thing.x, thing.y - 20, "#ffd75e");
      if (thing.kind === "bonus") sounds.bonusStar(); else sounds.caught();
    }

    function usePowerUp(power, p) {
      const seconds = POWER_UPS[power].seconds;
      if (power === "life") lives = Math.min(RULES.maxLives, lives + 1);
      if (power === "big") p.bigTime = seconds;          // only the paddle that caught it
      if (power === "double") p.doubleTime = seconds;    // only the player who caught it
      if (power === "magnet") magnetTime = seconds;      // these help everyone
      if (power === "slow") slowTime = seconds;
      if (power === "shield") shieldTime = seconds;
    }

    // NEW: the bonus round
    function startBonus() {
      bonusTime = RULES.bonusSeconds;
      for (const thing of falling) {
        if (thing.kind === "bomb") {                  // bombs vanish in a puff of smoke
          thing.gone = true;
          burst(thing.x, thing.y, ["#999", "white"]);
        }
      }
      banner("BONUS ROUND!");
      sounds.bonus();
    }

    // ---------------------------------------------------------------
    // 4. UPDATE
    // ---------------------------------------------------------------
    function update(dt) {
      clock += dt;

      // effects keep fading even on the game over screen
      for (const s of sparkles) {
        s.x += s.moveX * dt;
        s.y += s.moveY * dt;
        s.moveY += 400 * dt;          // gravity pulls them down
        s.life -= dt;
      }
      sparkles = sparkles.filter(function (s) { return s.life > 0; });
      for (const word of popups) {
        word.y -= 40 * dt;            // float up
        word.life -= dt;
      }
      popups = popups.filter(function (word) { return word.life > 0; });
      if (shakeTime > 0) shakeTime -= dt;
      if (bannerTimer > 0) bannerTimer -= dt;

      if (gameState !== "playing") return;

      // NEW: power-up timers count down
      magnetTime = Math.max(0, magnetTime - dt);
      slowTime = Math.max(0, slowTime - dt);
      shieldTime = Math.max(0, shieldTime - dt);
      for (const p of players) {
        p.bigTime = Math.max(0, p.bigTime - dt);
        p.doubleTime = Math.max(0, p.doubleTime - dt);
      }
      if (bonusTime > 0) {
        bonusTime -= dt;
        if (bonusTime <= 0) {
          bonusTime = 0;
          banner("BONUS OVER!");
        }
      }

      for (const p of activePlayers()) {
        // NEW: grow or shrink smoothly, staying centered
        const targetWidth = p.bigTime > 0 ? p.baseWidth * 1.8 : p.baseWidth;
        const center = p.x + p.width / 2;
        p.width += (targetWidth - p.width) * Math.min(1, dt * 8);
        p.x = center - p.width / 2;
      }

      // each finger pulls its paddle to where the finger is
      for (const id in fingers) {
        const finger = fingers[id];
        finger.paddle.x = finger.x - finger.paddle.width / 2;
      }

      // move each paddle with its own keys
      for (const p of activePlayers()) {
        let left = keys[p.leftKey];
        let right = keys[p.rightKey];
        if (playerCount === 1) {            // playing alone? both sets of keys work
          left = keys["a"] || keys["ArrowLeft"];
          right = keys["d"] || keys["ArrowRight"];
        }
        if (left) p.x -= p.speed * dt;
        if (right) p.x += p.speed * dt;

        if (p.x < 0) p.x = 0;
        if (p.x > canvas.width - p.width) p.x = canvas.width - p.width;
      }

      // NEW: every 10 normal stars is a new level, and some levels start a bonus round
      const newLevel = 1 + Math.floor(starsCaught / 10);
      if (newLevel > level) {
        level = newLevel;
        if (level % RULES.bonusEvery === 0) {
          startBonus();
        } else {
          banner("LEVEL " + level + "!");
          sounds.levelUp();
        }
      }

      // things drop faster in a bonus round
      const spawnEvery = bonusTime > 0 ? 0.22 : Math.max(0.25, 0.8 - (level - 1) * 0.1);
      spawnTimer += dt;
      if (spawnTimer >= spawnEvery) {
        spawnTimer = 0;
        spawnThing();
      }

      const slowDown = slowTime > 0 ? 0.5 : 1;     // the turtle makes everything fall at half speed

      for (const thing of falling) {
        thing.y += thing.speed * slowDown * dt;

        // the magnet pulls good things sideways toward the closest paddle (never bombs!)
        if (magnetTime > 0 && thing.kind !== "bomb") {
          const p = closestPaddle(thing.x);
          const pull = 220 * dt;
          const gap = p.x + p.width / 2 - thing.x;
          thing.x += Math.max(-pull, Math.min(pull, gap));
        }

        for (const p of activePlayers()) {
          if (!thing.gone && touching(thing, p)) collect(thing, p);
        }

        // the shield catches stars just before they hit the ground
        if (!thing.gone && shieldTime > 0 && thing.kind === "star" && thing.y > canvas.height - 28) {
          thing.gone = true;
          burst(thing.x, canvas.height - 28, ["#7df9ff", "white"]);
          sounds.shield();
        }

        if (!thing.gone && thing.y > canvas.height + thing.size) {
          thing.gone = true;
          if (thing.kind === "star") {           // only missing a normal star costs a life
            lives -= 1;
            shakeTime = 0.25;
            sounds.missed();
          }
        }
      }

      falling = falling.filter(function (thing) { return !thing.gone; });

      if (lives <= 0) {
        lives = 0;
        endGame();
      }
    }

    // ---------------------------------------------------------------
    // 5. DRAW
    // ---------------------------------------------------------------
    // draw the 1 PLAYER and 2 PLAYERS buttons
    function drawButtons() {
      for (const b of buttons) {
        pen.fillStyle = "#ffd75e";
        pen.fillRect(b.x, b.y, b.width, b.height);
        pen.fillStyle = "#1d2340";
        pen.font = "bold 20px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.fillText(b.label, b.x + b.width / 2, b.y + b.height / 2);
      }
    }

    function drawMessage(title, lines, prompt) {
      pen.fillStyle = "rgba(0, 0, 0, 0.65)";
      pen.fillRect(0, 0, canvas.width, canvas.height);

      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = "bold 44px sans-serif";
      pen.fillText(title, canvas.width / 2, canvas.height / 2 - 90);

      pen.font = "19px sans-serif";
      for (let i = 0; i < lines.length; i++) {
        pen.fillText(lines[i], canvas.width / 2, canvas.height / 2 - 30 + i * 32);
      }

      pen.fillStyle = "#ffd75e";
      pen.font = "bold 19px sans-serif";
      pen.fillText(prompt, canvas.width / 2, canvas.height / 2 + 100);
    }

    // NEW: a little guide to the power-ups on the start screen
    function drawPowerUpGuide() {
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.font = "15px sans-serif";
      pen.fillStyle = "#cfd3ee";
      pen.fillText("❤️ extra life    🍄 big paddle    🧲 star magnet", canvas.width / 2, 100);
      pen.fillText("🐢 slow motion    🛡️ shield    💎 double points", canvas.width / 2, 128);
      pen.fillText("Dodge 💣 bombs!   🌟 Bonus round every 3 levels", canvas.width / 2, 156);
    }

    // a paddle with a white outline, so even a black paddle shows up
    function drawPaddle(p) {
      pen.fillStyle = p.color;
      pen.fillRect(p.x, p.y, p.width, p.height);
      pen.strokeStyle = p.doubleTime > 0 ? "#ffd75e" : "white";   // gold outline = double points
      pen.lineWidth = p.doubleTime > 0 ? 4 : 2;
      pen.strokeRect(p.x, p.y, p.width, p.height);

      let label = playerCount === 2 ? (p.name === "Player 1" ? "P1" : "P2") : "";
      if (p.doubleTime > 0) label += (label ? " " : "") + "x2";
      if (label) {
        pen.fillStyle = p.doubleTime > 0 ? "#ffd75e" : "white";
        pen.font = "bold 12px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "bottom";
        pen.fillText(label, p.x + p.width / 2, p.y - 4);
      }
    }

    function drawScore(p, y) {
      pen.fillStyle = p.color;
      pen.fillRect(16, y, 16, 16);
      pen.strokeStyle = "white";
      pen.lineWidth = 2;
      pen.strokeRect(16, y, 16, 16);
      pen.fillStyle = "white";
      pen.font = "bold 20px sans-serif";
      pen.textAlign = "left";
      pen.textBaseline = "top";
      pen.fillText(p.name + ": " + p.score, 40, y - 2);
    }

    // NEW: the power-ups that are on right now, with seconds left
    function drawActivePowerUps() {
      const active = [];
      if (magnetTime > 0) active.push("🧲" + Math.ceil(magnetTime));
      if (slowTime > 0) active.push("🐢" + Math.ceil(slowTime));
      if (shieldTime > 0) active.push("🛡️" + Math.ceil(shieldTime));
      for (const p of activePlayers()) {
        const who = playerCount === 2 ? (p.name === "Player 1" ? "P1" : "P2") : "";
        if (p.bigTime > 0) active.push(who + "🍄" + Math.ceil(p.bigTime));
        if (p.doubleTime > 0) active.push(who + "💎" + Math.ceil(p.doubleTime));
      }
      if (active.length === 0) return;
      pen.fillStyle = "#7df9ff";
      pen.font = "bold 15px sans-serif";
      pen.textAlign = "center";
      pen.textBaseline = "top";
      pen.fillText(active.join("   "), canvas.width / 2 + 40, 44);
    }

    function draw() {
      pen.clearRect(0, 0, canvas.width, canvas.height);

      // NEW: a golden glow during the bonus round
      if (bonusTime > 0) {
        pen.fillStyle = "rgba(255, 200, 60, " + (0.10 + 0.05 * Math.sin(clock * 6)) + ")";
        pen.fillRect(0, 0, canvas.width, canvas.height);
      }

      // --- the game world (this part shakes) ---
      pen.save();
      if (shakeTime > 0) {
        pen.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
      }

      // NEW: the shield is a glowing line near the ground (it blinks when it's about to run out)
      if (shieldTime > 0 && (shieldTime > 2 || Math.sin(clock * 20) > 0)) {
        pen.fillStyle = "rgba(125, 249, 255, " + (0.6 + 0.3 * Math.sin(clock * 10)) + ")";
        pen.fillRect(0, canvas.height - 28, canvas.width, 5);
      }

      pen.textAlign = "center";
      pen.textBaseline = "middle";
      for (const thing of falling) {
        if (thing.kind === "power") {
          // a glowing bubble so power-ups stand out
          pen.fillStyle = "rgba(125, 249, 255, " + (0.25 + 0.15 * Math.sin(clock * 8)) + ")";
          pen.beginPath();
          pen.arc(thing.x, thing.y, thing.size * 0.75, 0, Math.PI * 2);
          pen.fill();
        }
        pen.font = thing.size + "px sans-serif";
        pen.fillText(thing.picture, thing.x, thing.y);
      }

      for (const s of sparkles) {
        pen.globalAlpha = s.life / 0.6;     // fade out as life runs down
        pen.fillStyle = s.color;
        pen.fillRect(s.x - 2, s.y - 2, 4, 4);
      }
      pen.globalAlpha = 1;

      for (const p of activePlayers()) drawPaddle(p);

      // floating words
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.font = "bold 20px sans-serif";
      for (const word of popups) {
        pen.globalAlpha = Math.max(0, word.life);
        pen.fillStyle = word.color;
        pen.fillText(word.text, word.x, word.y);
      }
      pen.globalAlpha = 1;
      pen.restore();

      // --- the scoreboard (this part stays still) ---
      drawScore(players[0], 16);
      if (playerCount === 2) drawScore(players[1], 44);

      pen.font = "bold 20px sans-serif";
      pen.textAlign = "center";
      pen.textBaseline = "top";
      if (bonusTime > 0) {
        pen.fillStyle = "#ffd75e";
        pen.fillText("BONUS " + Math.ceil(bonusTime), canvas.width / 2 + 40, 14);
      } else {
        pen.fillStyle = "white";
        pen.fillText("Level " + level, canvas.width / 2 + 40, 14);
      }
      pen.textAlign = "right";
      pen.fillText("❤️".repeat(lives), canvas.width - 16, 14);
      pen.font = "14px sans-serif";
      pen.fillStyle = "#aab";
      pen.fillText("Best: " + best, canvas.width - 16, 44);

      drawActivePowerUps();

      // controls reminder
      pen.font = "14px sans-serif";
      pen.fillStyle = "#aab";
      pen.textAlign = "center";
      pen.textBaseline = "bottom";
      if (touchScreen) {
        pen.fillText("Drag your paddle with a finger", canvas.width / 2, canvas.height - 6);
      } else {
        pen.fillText(
          (playerCount === 2 ? "P1: A / D    P2: ← →" : "← → or A / D, or drag") +
          "    P: pause    M: sound " + (soundOn ? "on" : "off"),
          canvas.width / 2, canvas.height - 6
        );
      }

      // big message that fades away ("LEVEL 2!", "BONUS ROUND!")
      if (bannerTimer > 0) {
        pen.globalAlpha = Math.min(1, bannerTimer);
        pen.fillStyle = "#ffd75e";
        pen.font = "bold 44px sans-serif";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.fillText(bannerText, canvas.width / 2, canvas.height / 2);
        pen.globalAlpha = 1;
      }

      // screens for each game state
      if (gameState === "start") {
        drawMessage("STAR CATCHER",
          ["Catch ⭐, grab power-ups, dodge 💣!",
           touchScreen ? "Drag your paddle with a finger" : "Player 1: A / D     Player 2: ← →",
           "Best score: " + best],
          "How many players?");
        drawPowerUpGuide();
        drawButtons();
      }
      if (gameState === "paused") {
        drawMessage("PAUSED", ["Take a breather."], touchScreen ? "Tap to keep playing" : "Press P or click to keep playing");
      }
      if (gameState === "gameover") {
        drawMessage("GAME OVER",
          [resultText(), newBest ? "NEW BEST SCORE!" : "Best score: " + best],
          "Play again?");
        drawButtons();
      }
    }

    // who won?
    function resultText() {
      if (playerCount === 1) return "You scored " + players[0].score + " points";
      const p1 = players[0].score;
      const p2 = players[1].score;
      if (p1 > p2) return "Player 1 wins, " + p1 + " to " + p2 + "!";
      if (p2 > p1) return "Player 2 wins, " + p2 + " to " + p1 + "!";
      return "It's a tie, " + p1 + " to " + p2 + "!";
    }

    // ---------------------------------------------------------------
    // 6. GAME LOOP
    // ---------------------------------------------------------------
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
