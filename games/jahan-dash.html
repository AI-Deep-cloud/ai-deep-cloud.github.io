<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- tells phones to show the page at its real size instead of zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jahan Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;          /* the part of the screen you can really see (phones) */
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 12px 0 24px;
    }
    /* the game area: as big as fits the screen, always 480 x 600 in shape */
    .stage {
      position: relative;
      width: min(480px, 100vw, calc(92vh * 0.8));
      width: min(480px, 100vw, calc((100dvh - 40px) * 0.8));
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #5fb8f2;
      border: 3px solid #fff;
      border-radius: 6px;
      box-sizing: border-box;
      touch-action: none;        /* tapping and swiping play the game, they don't scroll the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* the box where you type your name */
    .name-form {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(300px, 82%);
      padding: 18px;
      background: #1d2340;
      border: 3px solid #ffd75e;
      border-radius: 12px;
      box-shadow: 6px 6px 0 #000;
      color: #fff;
      font-family: Fredoka, sans-serif;
      text-align: center;
    }
    .name-form .trophy { font-size: 40px; line-height: 1; }
    .name-form h2 { margin: 8px 0 2px; font-size: 24px; color: #ffd75e; }
    .name-form p { margin: 0 0 12px; color: #cfd3ee; }
    .name-form input {
      width: 100%;
      padding: 10px;
      font: 600 20px Fredoka, sans-serif;
      text-align: center;
      background: #12152b;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .name-form input:focus { outline: none; border-color: #ffd75e; }
    .name-form .name-label { display: block; margin: 10px 0 4px; text-align: left; font-weight: 600; font-size: 14px; color: #cfd3ee; }
    .name-form .name-error { margin: 10px 0 0; color: #ff8fc7; font-weight: 600; }
    .name-form .row { display: flex; gap: 8px; margin-top: 12px; }
    .name-form button {
      flex: 1;
      padding: 10px;
      font: 600 18px Fredoka, sans-serif;
      border-radius: 8px;
      cursor: pointer;
    }
    .name-form .save { background: #ffd75e; color: #1d2340; border: 2px solid #ffd75e; }
    .name-form .skip { background: transparent; color: #fff; border: 2px solid #fff; }
    .hidden { display: none !important; }
    /* link back to the arcade's home page */
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      background: #ffd75e;
      color: #1d2340;
      font: 600 15px Fredoka, sans-serif;
      text-decoration: none;
      border-radius: 6px;
    }
    /* phones: game near the top, a little space at the bottom */
    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 8px 0 calc(28px + env(safe-area-inset-bottom));
      }
      .back {
        position: static;
        align-self: flex-start;
        margin: 0 0 8px 10px;
        padding: 5px 10px;
        font-size: 14px;
      }
      .stage {
        width: min(100vw, calc(88vh * 0.8));
        width: min(100vw, calc((100dvh - 90px) * 0.8));
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">&larr; Arcade</a>
  <div class="stage">
    <canvas id="game" width="480" height="600"></canvas>

    <!-- asks for your name before you play -->
    <form class="name-form hidden" id="name-form" autocomplete="off">
      <div class="trophy">🔍</div>
      <h2>What's your name?</h2>
      <p>It goes on the scoreboard when you get a top score.</p>
      <label class="name-label hidden" id="name-label-1" for="name-input-1">Player 1</label>
      <input id="name-input-1" type="text" maxlength="12" placeholder="Your name" aria-label="Player 1 name" spellcheck="false">
      <label class="name-label hidden" id="name-label-2" for="name-input-2">Player 2</label>
      <input class="hidden" id="name-input-2" type="text" maxlength="12" placeholder="Player 2's name" aria-label="Player 2 name" spellcheck="false">
      <p class="name-error hidden" id="name-error" role="alert"></p>
      <div class="row">
        <button class="save" type="submit" id="name-go">Play ▶</button>
        <button class="skip" type="button" id="name-cancel">Back</button>
      </div>
    </form>
  </div>

  <script>
    // ===============================================================
    //  JAHAN DASH
    //  Jahan is a very curious kid who lives in Tiny Town.
    //  Run through town, jump and slide past everything in the way,
    //  and fill the Curiosity Book with amazing discoveries!
    //  Built the same way as our other games: STATE, INPUT, UPDATE, DRAW and the GAME LOOP.
    // ===============================================================

    // ---------------------------------------------------------------
    // 1. SETUP
    // ---------------------------------------------------------------
    const canvas = document.getElementById("game");
    const pen = canvas.getContext("2d");
    const W = 480;                   // the game is always 480 wide and 600 tall...
    const H = 600;
    // ...but we draw it with extra detail on sharp screens (like phones), so it never looks blurry
    const DPR = Math.min(3, window.devicePixelRatio || 1);
    canvas.width = W * DPR;
    canvas.height = H * DPR;

    const FONT = "Fredoka, 'Trebuchet MS', sans-serif";
    function font(size, weight) { return (weight || 600) + " " + size + "px " + FONT; }

    const GROUND = 468;              // where Jahan's feet touch the sidewalk
    const GAME_ID = "jahan-dash";    // this game's name in the online scoreboard
    const GRAVITY = 2300;
    const JUMP = 800;                // how hard a jump pushes up
    const DOUBLE_JUMP = 680;         // the second jump, in the air
    const METER = 40;                // 40 pixels = 1 meter
    const KID_SIZE = 1.25;           // how big Jahan is drawn
    const INK = "#1d1b2f";           // the dark outline color (cartoon style)

    // How Jahan looks. Change these colors to match the real Jahan!
    const JAHAN_LOOK = { skin: "#c98b5c", hair: "#2b1b0e", shirt: "#ff8c2b", shorts: "#2f4b9a", shoes: "#e63946", pack: "#ffd23f" };
    const BUDDY_LOOK = { skin: "#f1c27d", hair: "#8b4513", shirt: "#ff6fb5", shorts: "#2d6a4f", shoes: "#3a86ff", pack: "#7ae582" };

    // ---------------------------------------------------------------
    // 2. STATE
    // ---------------------------------------------------------------
    function makeRunner(name, look, x) {
      return {
        name: name,
        look: look,
        x: x, y: GROUND,         // y is where the feet are
        vy: 0,
        onGround: true,
        jumpsLeft: 2,            // a jump, then a double jump
        jumpedAt: -9,
        sliding: 0,              // seconds of sliding left
        slideWhenLanding: false,
        lives: 0,
        alive: false,
        invincible: 0,           // seconds of blinking after bumping into something
        meters: 0,
        bonus: 0,                // points from stars, discoveries and missions
        score: 0,
        stars: 0, found: 0, jumps: 0, slides: 0, boxes: 0,
        helmet: 0, balloon: 0, skate: 0, magnet: 0, double: 0,   // power-ups (seconds left)
        runPhase: 0,
        dustTimer: 0
      };
    }
    const players = [
      makeRunner("Jahan", JAHAN_LOOK, 150),
      makeRunner("Buddy", BUDDY_LOOK, 95)
    ];
    let playerCount = 1;

    // THE CURIOSITY BOOK: everything Jahan can discover. Rare ones are harder to find!
    const DISCOVERIES = [
      { picture: "🐞", name: "Ladybug",          rarity: "common" },
      { picture: "🦋", name: "Butterfly",        rarity: "common" },
      { picture: "🐌", name: "Snail",            rarity: "common" },
      { picture: "🐸", name: "Frog",             rarity: "common" },
      { picture: "🍄", name: "Mushroom",         rarity: "common" },
      { picture: "🌻", name: "Sunflower",        rarity: "common" },
      { picture: "🐚", name: "Seashell",         rarity: "common" },
      { picture: "🍁", name: "Maple leaf",       rarity: "common" },
      { picture: "🐿️", name: "Squirrel",         rarity: "rare" },
      { picture: "🍀", name: "Four-leaf clover", rarity: "rare" },
      { picture: "🦔", name: "Hedgehog",         rarity: "rare" },
      { picture: "💎", name: "Crystal",          rarity: "rare" },
      { picture: "🦕", name: "Dino fossil",      rarity: "rare" },
      { picture: "☄️", name: "Meteorite",        rarity: "legendary" },
      { picture: "👑", name: "Lost crown",       rarity: "legendary" },
      { picture: "🛸", name: "UFO",              rarity: "legendary" }
    ];
    const RARITY = {
      common:    { chance: 10, points: 10, color: "255, 255, 255" },
      rare:      { chance: 3,  points: 25, color: "125, 249, 255" },
      legendary: { chance: 1,  points: 60, color: "255, 215, 94" }
    };
    let book = {};               // which discoveries have been found (saved on this device)
    try { book = JSON.parse(localStorage.getItem("jahanBook") || "{}") || {}; } catch (e) {}
    function saveBook() { try { localStorage.setItem("jahanBook", JSON.stringify(book)); } catch (e) {} }
    function bookCount() { return DISCOVERIES.filter(function (d) { return book[d.name]; }).length; }

    // POWER-UPS from mystery boxes
    const POWER_UPS = {
      balloon: { picture: "🎈", message: "BALLOON RIDE!",  seconds: 5 },
      skate:   { picture: "🛹", message: "SKATEBOARD!",    seconds: 6 },
      magnet:  { picture: "🧲", message: "STAR MAGNET!",   seconds: 8 },
      helmet:  { picture: "🛡️", message: "HELMET ON!",     seconds: 20 },
      double:  { picture: "✨", message: "DOUBLE STARS!",  seconds: 10 }
    };

    // MISSIONS: finish one for +50 points, then a harder one appears
    const MISSIONS = [
      { text: "Collect {n} ⭐",            stat: "stars",  amounts: [20, 50, 100, 200, 300] },
      { text: "Jump {n} times",            stat: "jumps",  amounts: [15, 40, 80, 150, 250] },
      { text: "Run {n} m",                 stat: "meters", amounts: [200, 500, 1000, 1800, 3000] },
      { text: "Find {n} discoveries",      stat: "found",  amounts: [2, 4, 8, 12, 20] },
      { text: "Slide {n} times",           stat: "slides", amounts: [5, 12, 25, 40, 60] },
      { text: "Open {n} mystery boxes",    stat: "boxes",  amounts: [1, 2, 4, 6, 9] }
    ];
    const MISSION_POINTS = 50;

    // DIFFICULTY. Each one changes these numbers.
    const DIFFICULTIES = {
      easy: {
        label: "EASY",
        lives: 3,
        startSpeed: 250,         // pixels per second
        speedUp: 3,              // gets this much faster every second
        topSpeed: 520,
        gapMin: 1.4,             // seconds between obstacles (shortest)...
        gapMax: 2.4              // ...and longest
      },
      medium: {
        label: "MEDIUM",
        lives: 2,
        startSpeed: 300,
        speedUp: 4.5,
        topSpeed: 620,
        gapMin: 1.1,
        gapMax: 2.0
      },
      hard: {
        label: "HARD",
        lives: 1,
        startSpeed: 350,
        speedUp: 6,
        topSpeed: 720,
        gapMin: 0.9,
        gapMax: 1.6
      }
    };
    const DIFFICULTY_ORDER = ["easy", "medium", "hard"];
    let difficulty = "medium";
    try {
      const savedDifficulty = localStorage.getItem("jahanDashDifficulty");
      if (DIFFICULTIES[savedDifficulty]) difficulty = savedDifficulty;
    } catch (e) {}

    function settings() { return DIFFICULTIES[difficulty]; }

    function setDifficulty(name) {
      if (!DIFFICULTIES[name] || name === difficulty) return;
      difficulty = name;
      justAdded = [];
      newBest = false;
      onlineNote = "";
      best = board().length ? board()[0].score : 0;
      try { localStorage.setItem("jahanDashDifficulty", difficulty); } catch (e) {}
      sounds.star();
      loadOnlineScores(name);
    }

    function stepDifficulty(direction) {
      const i = DIFFICULTY_ORDER.indexOf(difficulty) + direction;
      if (i >= 0 && i < DIFFICULTY_ORDER.length) setDifficulty(DIFFICULTY_ORDER[i]);
    }

    let obstacles = [];        // things to jump over or slide under
    let items = [];            // stars, discoveries and mystery boxes
    let sparkles = [];         // little bits that fly out
    let puffs = [];            // dust clouds
    let popups = [];
    let speed = 0;             // how fast Tiny Town scrolls by
    let distance = 0;          // pixels run this game
    let playTime = 0;
    let nextObstacleIn = 0;
    let nextStarsIn = 0;
    let nextDiscoveryIn = 0;
    let nextBoxIn = 0;
    let mission = null;        // { text, stat, goal, start }
    let missionLevel = 0;
    let missionsDone = 0;
    let gameState = "start";   // "start", "playing", "paused" or "gameover"
    let shakeTime = 0;
    let bannerText = "";
    let bannerSub = "";
    let bannerTimer = 0;
    let clock = 0;
    let dayTime = 0.15;        // 0 to 1: day, sunset, night, sunrise...
    let gameOverAt = -99;

    // the scenery (it scrolls at different speeds so it looks deep)
    let clouds = [];
    let houses = [];
    let trees = [];
    let sceneryX = 0;

    // ---------------------------------------------------------------
    // TOP 3 SCORES with names: one list per difficulty on this device,
    // plus the shared online scoreboard everyone sees
    // ---------------------------------------------------------------
    let scores = { easy: [], medium: [], hard: [] };
    let names = ["", ""];
    let justAdded = [];
    let newBest = false;

    function cleanList(list) {
      if (!Array.isArray(list)) return [];
      return list.filter(function (e) { return e && typeof e.score === "number"; }).slice(0, 3);
    }

    try {
      const saved = JSON.parse(localStorage.getItem("jahanDashScores") || "{}");
      for (const name of DIFFICULTY_ORDER) scores[name] = cleanList(saved[name]);
      const savedNames = JSON.parse(localStorage.getItem("arcadeNames") || localStorage.getItem("starCatcherNames") || "[]");
      if (Array.isArray(savedNames)) names = [savedNames[0] || "", savedNames[1] || ""];
    } catch (e) {}

    function saveLeaderboard() {
      try {
        localStorage.setItem("jahanDashScores", JSON.stringify(scores));
        localStorage.setItem("arcadeNames", JSON.stringify(names));
      } catch (e) {}
    }

    // the shared online scoreboard (a free Google Firebase database)
    const FIREBASE_PROJECT = "star-catcher-891e9";
    const DATABASE = "projects/" + FIREBASE_PROJECT + "/databases/(default)/documents";
    const DATABASE_URL = "https://firestore.googleapis.com/v1/" + DATABASE;
    const MAX_ONLINE_SCORE = 5000;      // the database's limit, so huge runs count as 5000 online

    let onlineScores = { easy: null, medium: null, hard: null };
    let lastOnlineCheck = -999;
    let lastAllCheck = -999;
    let checkingScores = false;
    let onlineNote = "";

    async function loadOnlineScores(name) {
      try {
        const response = await fetch(DATABASE_URL + "/arcade/" + GAME_ID + ":runQuery", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ structuredQuery: {
            from: [{ collectionId: name }],
            orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }],
            limit: 6
          } })
        });
        if (!response.ok) throw new Error("status " + response.status);
        const rows = await response.json();
        onlineScores[name] = rows
          .filter(function (row) { return row.document && row.document.fields; })
          .map(function (row) {
            const fields = row.document.fields;
            return { name: fields.name ? fields.name.stringValue : "", score: Number(fields.score ? fields.score.integerValue : 0) };
          })
          .filter(function (entry) { return entry.name && isKidFriendly(entry.name); })
          .slice(0, 3);
      } catch (error) {
        onlineScores[name] = null;
      }
      if (name === difficulty) best = board().length ? board()[0].score : 0;
    }

    async function sendOnlineScore(name, playerName, score) {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try {
        const response = await fetch(DATABASE_URL + ":commit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ writes: [{
            update: {
              name: DATABASE + "/arcade/" + GAME_ID + "/" + name + "/" + id,
              fields: { name: { stringValue: playerName }, score: { integerValue: String(Math.min(score, MAX_ONLINE_SCORE)) } }
            },
            updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
            currentDocument: { exists: false }
          }] })
        });
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    function isOnline() { return onlineScores[difficulty] !== null; }
    function board() { return isOnline() ? onlineScores[difficulty] : scores[difficulty]; }
    let best = board().length ? board()[0].score : 0;

    function madeTopThree(score) {
      const list = board();
      return score > 0 && (list.length < 3 || score > list[list.length - 1].score);
    }

    function insertScore(list, entry) {
      const longer = list.concat([entry]);
      longer.sort(function (a, b) { return b.score - a.score; });
      return longer.slice(0, 3);
    }

    function addScore(name, score) {
      const level = difficulty;
      const entry = { name: name, score: score };
      scores[level] = insertScore(scores[level], entry);       // this device's list
      saveLeaderboard();
      let shown = entry;
      if (onlineScores[level]) {                               // everyone's list (huge runs count as 5000 there)
        shown = { name: name, score: Math.min(score, MAX_ONLINE_SCORE) };
        onlineScores[level] = insertScore(onlineScores[level], shown);
        sendOnlineScore(level, name, score).then(function (saved) {
          if (!saved) onlineNote = "Couldn't save that score online.";
          loadOnlineScores(level);
        });
      }
      justAdded.push(shown);
      if (board()[0] === shown) newBest = true;
      best = board()[0].score;
    }

    function isJustAdded(entry) {
      return justAdded.some(function (j) { return j.name === entry.name && j.score === entry.score; });
    }

    // ---------------------------------------------------------------
    // KID-FRIENDLY NAMES (the same check as our other games)
    // ---------------------------------------------------------------
    const BLOCKED_PARTS = ["fuck", "fuk", "shit", "bitch", "cunt", "dick", "cock", "pussy", "porn", "sex",
      "nazi", "hitler", "penis", "vagina", "boob", "slut", "whore", "bastard", "nigg", "fag", "retard",
      "piss", "wank", "twat", "horny", "nude", "naked", "kkk"];
    const BLOCKED_WORDS = ["ass", "arse", "asshole", "rape", "hell", "damn", "crap", "suck", "sucks",
      "stupid", "idiot", "dumb", "loser", "hate", "ugly", "fat", "weirdo"];
    const ALLOWED_PARTS = ["peacock", "cockatoo", "cockatiel", "cockroach", "hancock", "hitchcock",
      "shuttlecock", "dickens", "essex", "sussex", "middlesex"];

    function isKidFriendly(name) {
      const lookAlikes = { "0": "o", "1": "i", "3": "e", "4": "a", "5": "s", "7": "t", "8": "b", "@": "a", "$": "s", "!": "i" };
      const spaced = name.replace(/([a-z])([A-Z])/g, "$1 $2")
        .toLowerCase()
        .replace(/[0134578@$!]/g, function (c) { return lookAlikes[c]; });
      let letters = spaced.replace(/[^a-z]/g, "");
      for (const ok of ALLOWED_PARTS) letters = letters.split(ok).join("");
      const squashed = letters.replace(/(.)\1+/g, "$1");
      for (const part of BLOCKED_PARTS) {
        if (letters.includes(part) || squashed.includes(part)) return false;
      }
      for (const word of spaced.split(/[^a-z]+/)) {
        if (BLOCKED_WORDS.includes(word) || BLOCKED_WORDS.includes(word.replace(/(.)\1+/g, "$1"))) return false;
      }
      return true;
    }

    // ---------------------------------------------------------------
    // PLAYER NAMES: asked before your first game, then remembered
    // ---------------------------------------------------------------
    let nameFormOpen = false;
    let nameFormPlayers = 1;
    let startAfterNames = false;

    function nameBox(n) { return document.getElementById("name-input-" + n); }

    function openNameForm(count, thenStart) {
      nameFormOpen = true;
      nameFormPlayers = count;
      startAfterNames = thenStart;
      const two = count === 2;
      document.getElementById("name-label-1").classList.toggle("hidden", !two);
      document.getElementById("name-label-2").classList.toggle("hidden", !two);
      nameBox(2).classList.toggle("hidden", !two);
      nameBox(1).value = names[0];
      nameBox(2).value = names[1];
      document.getElementById("name-go").textContent = thenStart ? "Play ▶" : "Save";
      document.getElementById("name-error").classList.add("hidden");
      document.getElementById("name-form").classList.remove("hidden");
      nameBox(1).focus();
      nameBox(1).select();
    }

    function closeNameForm() {
      nameFormOpen = false;
      document.getElementById("name-form").classList.add("hidden");
    }

    function showNameError(message, n) {
      const error = document.getElementById("name-error");
      error.textContent = message;
      error.classList.remove("hidden");
      nameBox(n).focus();
      nameBox(n).select();
    }

    document.getElementById("name-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const typed = [1, 2].map(function (n) { return nameBox(n).value.replace(/\s+/g, " ").trim().slice(0, 12); });
      for (let i = 0; i < nameFormPlayers; i++) {
        if (!typed[i]) {
          return showNameError(nameFormPlayers === 2 ? "Player " + (i + 1) + " needs a name first." : "Type your name first.", i + 1);
        }
        if (!isKidFriendly(typed[i])) return showNameError("That name isn't kid-friendly. Try another one! 🙂", i + 1);
      }
      names[0] = typed[0];
      if (nameFormPlayers === 2) names[1] = typed[1];
      saveLeaderboard();
      closeNameForm();
      if (startAfterNames) startGame(nameFormPlayers);
    });
    document.getElementById("name-cancel").addEventListener("click", closeNameForm);
    for (const n of [1, 2]) {
      nameBox(n).addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeNameForm();
      });
    }

    function tryStart(count) {
      if (clock - gameOverAt < 0.8) return;
      if (!names[0] || (count === 2 && !names[1])) openNameForm(count, true);
      else startGame(count);
    }

    function displayName(p) {
      return names[players.indexOf(p)] || p.name;
    }

    function activePlayers() {
      return players.slice(0, playerCount);
    }

    // ---------------------------------------------------------------
    // Starting and game over
    // ---------------------------------------------------------------
    function startGame(count) {
      playerCount = count;
      const d = settings();
      obstacles = [];
      items = [];
      sparkles = [];
      puffs = [];
      popups = [];
      speed = d.startSpeed;
      distance = 0;
      playTime = 0;
      nextObstacleIn = 700;
      nextStarsIn = 250;
      nextDiscoveryIn = 900;
      nextBoxIn = 2400;
      missionLevel = 0;
      missionsDone = 0;
      mission = null;
      shakeTime = 0;
      newBest = false;
      dayTime = 0.15;
      for (const p of players) {
        p.y = GROUND;
        p.vy = 0;
        p.onGround = true;
        p.jumpsLeft = 2;
        p.sliding = 0;
        p.slideWhenLanding = false;
        p.lives = d.lives;
        p.alive = false;
        p.invincible = 0;
        p.meters = 0;
        p.bonus = 0;
        p.score = 0;
        p.stars = 0; p.found = 0; p.jumps = 0; p.slides = 0; p.boxes = 0;
        p.helmet = 0; p.balloon = 0; p.skate = 0; p.magnet = 0; p.double = 0;
      }
      for (const p of activePlayers()) p.alive = true;
      players[0].x = playerCount === 2 ? 170 : 150;
      players[1].x = 95;
      newMission();
      banner("GO, " + displayName(players[0]).toUpperCase() + "!", playerCount === 2 ? "and " + displayName(players[1]) + "!" : "Explore Tiny Town!");
      gameState = "playing";
      sounds.start();
    }

    function endGame() {
      gameState = "gameover";
      gameOverAt = clock;
      sounds.gameOver();
      newBest = false;
      justAdded = [];
      onlineNote = "";
      const finished = activePlayers().slice().sort(function (a, b) { return b.score - a.score; });
      checkingScores = true;
      loadOnlineScores(difficulty).then(function () {
        checkingScores = false;
        lastOnlineCheck = clock;
        if (gameState !== "gameover") return;
        if (!isOnline()) onlineNote = "Couldn't reach the online scoreboard.";
        for (const p of finished) {
          if (madeTopThree(Math.min(p.score, isOnline() ? MAX_ONLINE_SCORE : p.score))) addScore(displayName(p), p.score);
        }
        if (justAdded.length > 0) sounds.mission();
      });
    }

    // ---------------------------------------------------------------
    // MISSIONS
    // ---------------------------------------------------------------
    function teamStat(stat) {
      let total = 0;
      for (const p of activePlayers()) total = stat === "meters" ? Math.max(total, p.meters) : total + p[stat];
      return Math.floor(total);
    }

    // pick a new mission (each one a bit harder than the last)
    function newMission() {
      let kind = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
      if (mission && kind.stat === mission.stat) kind = MISSIONS[(MISSIONS.indexOf(kind) + 1) % MISSIONS.length];
      const goal = kind.amounts[Math.min(missionLevel, kind.amounts.length - 1)];
      mission = {
        text: kind.text.replace("{n}", goal),
        stat: kind.stat,
        goal: goal,
        start: teamStat(kind.stat)        // count from now
      };
    }

    function missionProgress() { return mission ? teamStat(mission.stat) - mission.start : 0; }
    function missionTarget() { return mission ? mission.goal : 1; }

    function checkMission() {
      if (!mission) return;
      if (missionProgress() >= missionTarget()) {
        missionsDone += 1;
        missionLevel += 1;
        for (const p of activePlayers()) if (p.alive) p.bonus += MISSION_POINTS;
        banner("MISSION COMPLETE!", "+" + MISSION_POINTS + " points");
        confetti();
        sounds.mission();
        newMission();
      }
    }

    // ---------------------------------------------------------------
    // SOUND. The browser makes the beeps itself.
    // ---------------------------------------------------------------
    let audio = null;
    let soundOn = true;

    function startAudio() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    }

    function beep(pitch, length, shape, delay, loudness) {
      if (!audio || !soundOn) return;
      const start = audio.currentTime + (delay || 0);
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = shape || "square";
      tone.frequency.setValueAtTime(pitch, start);
      volume.gain.setValueAtTime(loudness || 0.08, start);
      volume.gain.exponentialRampToValueAtTime(0.001, start + length);
      tone.connect(volume);
      volume.connect(audio.destination);
      tone.start(start);
      tone.stop(start + length);
    }

    function tune(notes, length, shape, gap) {
      notes.forEach(function (pitch, i) { beep(pitch, length, shape, i * (gap || length)); });
    }

    const sounds = {
      jump:      function () { beep(330, 0.06, "triangle"); beep(520, 0.07, "triangle", 0.04); },
      doubleJump: function () { beep(520, 0.05, "triangle"); beep(780, 0.08, "triangle", 0.04); },
      slide:     function () { beep(180, 0.12, "sawtooth", 0, 0.05); },
      star:      function () { beep(988, 0.05, "square", 0, 0.06); beep(1319, 0.07, "square", 0.04, 0.06); },
      discovery: function () { tune([659, 784, 988, 1319], 0.08, "triangle", 0.06); },
      newFind:   function () { tune([523, 659, 784, 1047, 1319, 1568], 0.1, "square", 0.08); },
      box:       function () { tune([784, 988, 1175, 1568], 0.06, "triangle", 0.05); },
      bump:      function () { beep(110, 0.3, "sawtooth"); beep(70, 0.4, "square", 0.04); },
      smash:     function () { beep(200, 0.08, "square"); beep(140, 0.1, "sawtooth", 0.05); },
      saved:     function () { beep(600, 0.1, "triangle"); beep(900, 0.12, "triangle", 0.06); },
      woof:      function () { beep(240, 0.07, "square", 0, 0.05); beep(180, 0.09, "square", 0.08, 0.05); },
      mission:   function () { tune([523, 659, 784, 1047, 784, 1047], 0.11, "square", 0.09); },
      start:     function () { tune([392, 523, 659, 784], 0.1, "triangle", 0.09); },
      gameOver:  function () { beep(392, 0.25, "triangle"); beep(330, 0.25, "triangle", 0.25); beep(262, 0.6, "triangle", 0.5); }
    };

    // ---------------------------------------------------------------
    // 3. INPUT
    // ---------------------------------------------------------------
    function jump(p) {
      if (gameState !== "playing" || !p.alive || p.balloon > 0) return;
      if (p.onGround) {
        p.vy = -JUMP;
        p.onGround = false;
        p.jumpsLeft = 1;
        p.sliding = 0;
        p.jumpedAt = clock;
        p.jumps += 1;
        dust(p.x, GROUND, 4);
        sounds.jump();
      } else if (p.jumpsLeft > 0) {          // DOUBLE JUMP in the air
        p.vy = -DOUBLE_JUMP;
        p.jumpsLeft = 0;
        p.jumps += 1;
        burst(p.x, p.y, ["white", "#cfe8ff"], 160, 10);
        sounds.doubleJump();
      }
      checkMission();
    }

    function slide(p) {
      if (gameState !== "playing" || !p.alive || p.balloon > 0) return;
      if (!p.onGround && clock - p.jumpedAt < 0.15 && p.jumpsLeft === 1) {   // a swipe right after a tap: cancel the jump
        p.y = GROUND;
        p.vy = 0;
        p.onGround = true;
        p.jumpsLeft = 2;
        p.jumps = Math.max(0, p.jumps - 1);
      }
      if (p.onGround) {
        if (p.sliding <= 0) {
          p.slides += 1;
          dust(p.x + 10, GROUND, 5);
          sounds.slide();
        }
        p.sliding = 0.65;
      } else {                                // in the air: zoom down, then slide
        p.vy = Math.max(p.vy, 900);
        p.slideWhenLanding = true;
      }
      checkMission();
    }

    const JUMP_KEYS_P1 = [" ", "w", "W"];
    const SLIDE_KEYS_P1 = ["s", "S"];
    const JUMP_KEYS_P2 = ["ArrowUp", "Enter"];
    const SLIDE_KEYS_P2 = ["ArrowDown"];

    document.addEventListener("keydown", function (event) {
      if (nameFormOpen || checkingScores || event.target.tagName === "INPUT") return;
      if (event.key.startsWith("Arrow") || event.key === " ") event.preventDefault();
      startAudio();

      if (gameState === "start" || gameState === "gameover") {
        if (event.repeat) return;
        if (event.key === "1") tryStart(1);
        if (event.key === "2") tryStart(2);
        if (event.key === " " || event.key === "Enter") tryStart(playerCount);
        if (event.key === "ArrowLeft") stepDifficulty(-1);
        if (event.key === "ArrowRight") stepDifficulty(1);
        if (event.key.toLowerCase() === "n") {
          event.preventDefault();
          openNameForm(playerCount, false);
        }
      } else if (gameState === "playing" && !event.repeat) {
        const k = event.key;
        if (playerCount === 1) {
          if (JUMP_KEYS_P1.includes(k) || JUMP_KEYS_P2.includes(k)) jump(players[0]);
          if (SLIDE_KEYS_P1.includes(k) || SLIDE_KEYS_P2.includes(k)) slide(players[0]);
        } else {
          if (JUMP_KEYS_P1.includes(k)) jump(players[0]);
          if (SLIDE_KEYS_P1.includes(k)) slide(players[0]);
          if (JUMP_KEYS_P2.includes(k)) jump(players[1]);
          if (SLIDE_KEYS_P2.includes(k)) slide(players[1]);
        }
      }

      const letter = event.key.toLowerCase();
      if (letter === "p") {
        if (gameState === "playing") gameState = "paused";
        else if (gameState === "paused") gameState = "playing";
      }
      if (letter === "m") soundOn = !soundOn;
    });

    // TOUCH and MOUSE: tap to jump, swipe down to slide.
    // With 2 players, the left half is Player 1 and the right half is Player 2.
    const touchScreen = window.matchMedia("(pointer: coarse)").matches;
    let swipes = {};

    function gameSpot(event) {
      const box = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * W / box.width,
        y: (event.clientY - box.top) * H / box.height
      };
    }

    const buttons = [
      { label: "1 PLAYER",  players: 1, x: 50,  y: 425, width: 180, height: 56 },
      { label: "2 PLAYERS", players: 2, x: 250, y: 425, width: 180, height: 56 }
    ];
    const difficultyButtons = [
      { name: "easy",   x: 48,  y: 222, width: 120, height: 38 },
      { name: "medium", x: 180, y: 222, width: 120, height: 38 },
      { name: "hard",   x: 312, y: 222, width: 120, height: 38 }
    ];
    const changeNameButton = { x: 160, y: 528, width: 160, height: 34 };

    function inside(spot, box) {
      return spot.x > box.x && spot.x < box.x + box.width &&
             spot.y > box.y && spot.y < box.y + box.height;
    }

    canvas.addEventListener("pointerdown", function (event) {
      startAudio();
      if (nameFormOpen || checkingScores) return;
      const spot = gameSpot(event);

      if (gameState === "start" || gameState === "gameover") {
        for (const b of difficultyButtons) {
          if (inside(spot, b)) setDifficulty(b.name);
        }
        for (const b of buttons) {
          if (inside(spot, b)) tryStart(b.players);
        }
        if (inside(spot, changeNameButton)) openNameForm(playerCount, false);
        return;
      }
      if (gameState === "paused") {
        gameState = "playing";
        return;
      }
      const who = playerCount === 1 || spot.x < W / 2 ? 0 : 1;
      swipes[event.pointerId] = { x: spot.x, y: spot.y, who: who, used: false };
      jump(players[who]);                                    // tap = jump straight away
      try { canvas.setPointerCapture(event.pointerId); } catch (e) {}   // keep following the finger for a swipe
    });

    canvas.addEventListener("pointermove", function (event) {
      const swipe = swipes[event.pointerId];
      if (!swipe || swipe.used) return;
      const spot = gameSpot(event);
      if (spot.y - swipe.y > 24 && Math.abs(spot.y - swipe.y) > Math.abs(spot.x - swipe.x)) {   // swipe down = slide
        swipe.used = true;
        slide(players[swipe.who]);
      }
    });

    function endSwipe(event) { delete swipes[event.pointerId]; }
    canvas.addEventListener("pointerup", endSwipe);
    canvas.addEventListener("pointercancel", endSwipe);

    function refreshScoresSoon() {
      lastOnlineCheck = -999;
      lastAllCheck = -999;
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden && gameState === "playing") gameState = "paused";
      if (!document.hidden) refreshScoresSoon();
    });
    window.addEventListener("focus", refreshScoresSoon);

    // ---------------------------------------------------------------
    // Helper functions
    // ---------------------------------------------------------------
    function random(low, high) { return low + Math.random() * (high - low); }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

    // OBSTACLES. New kinds show up the further you run.
    //   w, h = size.  air = floats at head height (slide under it!)
    const OBSTACLE_TYPES = {
      can:    { w: 36, h: 48, from: 0 },
      cone:   { w: 32, h: 42, from: 0 },
      puddle: { w: 74, h: 10, from: 0 },
      fence:  { w: 56, h: 44, from: 120 },
      dog:    { w: 56, h: 40, from: 160, extraSpeed: 80 },
      bird:   { w: 44, h: 30, from: 250, air: true },
      bike:   { w: 66, h: 46, from: 350 },
      branch: { w: 92, h: 26, from: 500, air: true }
    };

    function spawnObstacle() {
      const meters = distance / METER;
      const kinds = Object.keys(OBSTACLE_TYPES).filter(function (k) { return meters >= OBSTACLE_TYPES[k].from; });
      const kind = pick(kinds);
      const type = OBSTACLE_TYPES[kind];
      const o = { kind: kind, x: W + 30, w: type.w, h: type.h, y: GROUND - type.h, extraSpeed: type.extraSpeed || 0, seed: Math.random() };
      if (kind === "bird") o.y = GROUND - 88;
      if (kind === "branch") o.y = GROUND - 86;
      obstacles.push(o);

      // a rainbow of stars over things you jump
      if (!type.air && Math.random() < 0.5) {
        for (let i = 0; i < 5; i++) {
          const t = i / 4;
          items.push({ kind: "star", x: o.x + o.w / 2 + (t - 0.5) * 130, y: GROUND - 70 - Math.sin(t * Math.PI) * 75, r: 12 });
        }
      }
      // sometimes two in a row (use your double jump!)
      if (meters > 400 && difficulty !== "easy" && Math.random() < 0.18 && !type.air) {
        obstacles.push({ kind: "cone", x: o.x + speed * 0.42, w: 32, h: 42, y: GROUND - 42, extraSpeed: 0, seed: Math.random() });
      }
    }

    function spawnStarRow() {
      const height = pick([GROUND - 30, GROUND - 30, GROUND - 110]);
      for (let i = 0; i < 6; i++) items.push({ kind: "star", x: W + 20 + i * 32, y: height, r: 12 });
    }

    function pickDiscovery() {
      let total = 0;
      for (const d of DISCOVERIES) total += RARITY[d.rarity].chance;
      let roll = Math.random() * total;
      for (const d of DISCOVERIES) {
        roll -= RARITY[d.rarity].chance;
        if (roll <= 0) return d;
      }
      return DISCOVERIES[0];
    }

    function spawnDiscovery() {
      items.push({ kind: "discovery", discovery: pickDiscovery(), x: W + 30, y: pick([GROUND - 36, GROUND - 105, GROUND - 175]), r: 17 });
    }

    function spawnBox() {
      items.push({ kind: "box", x: W + 30, y: GROUND - 125, r: 18 });
    }

    // the runner's box (smaller when sliding)
    function hitBox(p) {
      if (p.sliding > 0 && p.onGround) return { x: p.x - 28, y: p.y - 30, w: 56, h: 30 };
      return { x: p.x - 15, y: p.y - 78, w: 30, h: 78 };
    }

    function boxesTouch(a, b) {
      const give = 5;                       // a little forgiveness
      return a.x + give < b.x + b.w && a.x + a.w - give > b.x &&
             a.y + give < b.y + b.h && a.y + a.h - give > b.y;
    }

    function burst(x, y, colors, power, count) {
      colors = colors || ["#ffd75e", "white"];
      power = power || 260;
      for (let i = 0; i < (count || 20); i++) {
        sparkles.push({
          x: x, y: y,
          moveX: (Math.random() - 0.5) * power,
          moveY: (Math.random() - 0.5) * power,
          life: 0.6, max: 0.6,
          size: random(2.5, 5),
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function confetti() {
      const colors = ["#ffd23f", "#ff6fb5", "#3a86ff", "#7ae582", "#ff8c2b", "white"];
      for (let i = 0; i < 70; i++) {
        sparkles.push({
          x: random(40, W - 40), y: random(-20, 60),
          moveX: random(-80, 80), moveY: random(60, 220),
          life: 1.6, max: 1.6, size: random(3, 6), confetti: true, spin: random(0, 6),
          color: pick(colors)
        });
      }
    }

    function dust(x, y, count) {
      for (let i = 0; i < count; i++) {
        puffs.push({ x: x + random(-10, 10), y: y - random(0, 6), r: random(4, 8), grow: random(18, 30), life: 0.5, max: 0.5, drift: random(-60, -20) });
      }
    }

    function popup(text, x, y, color) {
      popups.push({ text: text, x: Math.max(80, Math.min(W - 80, x)), y: y, color: color, life: 1.1 });
    }

    function banner(text, sub) {
      bannerText = text;
      bannerSub = sub || "";
      bannerTimer = 1.8;
    }

    function collect(item, p) {
      item.gone = true;
      if (item.kind === "star") {
        const points = p.double > 0 ? 2 : 1;
        p.stars += 1;
        p.bonus += points;
        sounds.star();
        burst(item.x, item.y, ["#ffd23f", "#fff3b0"], 140, 6);
      } else if (item.kind === "discovery") {
        const d = item.discovery;
        const points = RARITY[d.rarity].points;
        p.found += 1;
        p.bonus += points;
        burst(item.x, item.y, ["#ffd75e", "#7df9ff", "white"], 340, 30);
        if (!book[d.name]) {                           // a brand new discovery for the book!
          book[d.name] = true;
          saveBook();
          banner("NEW DISCOVERY! " + d.picture, d.name + " · " + bookCount() + " / " + DISCOVERIES.length + " in the book");
          sounds.newFind();
        } else {
          popup(d.picture + " " + d.name + " +" + points, item.x, item.y - 26, "#7df9ff");
          sounds.discovery();
        }
      } else if (item.kind === "box") {
        const power = pick(Object.keys(POWER_UPS));
        p[power] = POWER_UPS[power].seconds;
        p.boxes += 1;
        p.bonus += 5;
        if (power === "balloon") {                      // a line of stars up in the sky
          for (let i = 0; i < 14; i++) items.push({ kind: "star", x: W + 40 + i * 36, y: GROUND - 225, r: 12 });
        }
        burst(item.x, item.y, ["#c58b4d", "#ffd75e", "white"], 360, 30);
        popup(POWER_UPS[power].picture + " " + POWER_UPS[power].message, item.x, item.y - 34, "#ffd75e");
        sounds.box();
      }
      checkMission();
    }

    // bumped into something!
    function bump(p, o) {
      if (p.invincible > 0) return;
      if (p.skate > 0 && !OBSTACLE_TYPES[o.kind].air) {    // the skateboard smashes right through
        o.smashed = true;
        o.spin = 0;
        p.bonus += 5;
        popup("SMASH! +5", o.x, o.y - 24, "#ffd75e");
        burst(o.x + o.w / 2, o.y + o.h / 2, ["#ffd75e", "#ff9f43", "white"], 380, 22);
        sounds.smash();
        return;
      }
      if (p.helmet > 0) {                                  // the helmet takes the hit
        p.helmet = 0;
        p.invincible = 1.2;
        popup("HELMET SAVED YOU!", p.x + 40, p.y - 100, "#7df9ff");
        burst(p.x, p.y - 50, ["#7df9ff", "white"], 340, 24);
        sounds.saved();
        return;
      }
      p.lives -= 1;
      p.invincible = 1.6;
      shakeTime = 0.35;
      burst(p.x, p.y - 40, ["#ff6b6b", "white"], 320, 24);
      sounds.bump();
      if (p.lives <= 0) {
        p.alive = false;
        if (playerCount === 2) popup(displayName(p) + " is out!", 240, 250, "#ff6b6b");
      } else {
        popup("OUCH!", p.x + 30, p.y - 100, "#ff6b6b");
      }
    }

    // scenery makers
    const HOUSE_COLORS = ["#ffb3ba", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#a0c4ff", "#bdb2ff", "#ffc6ff", "#f7c59f"];
    const ROOF_COLORS = ["#d1495b", "#8d6e63", "#4a6fa5", "#6a4c93", "#2a9d8f", "#e76f51", "#3d405b"];

    function addHouse(x) {
      const w = random(78, 118);
      houses.push({
        x: x, w: w, h: random(64, 112),
        color: pick(HOUSE_COLORS), roof: pick(ROOF_COLORS),
        windows: w > 96 ? 2 : 1,
        chimney: Math.random() < 0.45,
        bush: Math.random() < 0.7,
        flowers: Math.random() < 0.6,
        flowerColor: pick(["#ff6fb5", "#ffd23f", "#ff595e", "#ffffff", "#c77dff"]),
        round: Math.random() < 0.3                        // round attic window
      });
      return x + w + random(14, 40);
    }

    function setUpScenery() {
      clouds = [];
      for (let i = 0; i < 6; i++) clouds.push({ x: random(0, 540), y: random(110, 230), size: random(0.7, 1.35) });
      houses = [];
      houses.push({ sign: true, x: 250, w: 96, h: 60 });                // "Welcome to Tiny Town"
      let x = -20;
      while (x < W + 200) {
        x = addHouse(x);
        if (x > 225 && x < 370) x = 370;                                // leave room for the sign
      }
      trees = [];
      for (let tx = 30; tx < W + 200; tx += random(150, 260)) trees.push({ x: tx, lamp: Math.random() < 0.4, size: random(0.85, 1.15) });
    }
    setUpScenery();

    // ---------------------------------------------------------------
    // 4. UPDATE
    // ---------------------------------------------------------------
    function update(dt) {
      clock += dt;

      for (const s of sparkles) {
        s.x += s.moveX * dt;
        s.y += s.moveY * dt;
        s.moveY += (s.confetti ? 60 : 300) * dt;
        if (s.confetti) s.spin += dt * 8;
        s.life -= dt;
      }
      sparkles = sparkles.filter(function (s) { return s.life > 0; });
      for (const d of puffs) {
        d.x += d.drift * dt;
        d.r += d.grow * dt;
        d.life -= dt;
      }
      puffs = puffs.filter(function (d) { return d.life > 0; });
      for (const word of popups) {
        word.y -= 35 * dt;
        word.life -= dt;
      }
      popups = popups.filter(function (word) { return word.life > 0; });
      if (shakeTime > 0) shakeTime -= dt;
      if (bannerTimer > 0) bannerTimer -= dt;

      // keep the scoreboard up to date
      const onMenu = gameState === "start" || gameState === "gameover";
      if (!document.hidden && !checkingScores) {
        if (clock - lastOnlineCheck > (onMenu ? 10 : 30)) {
          lastOnlineCheck = clock;
          loadOnlineScores(difficulty);
        }
        if (onMenu && clock - lastAllCheck > 30) {
          lastAllCheck = clock;
          for (const name of DIFFICULTY_ORDER) {
            if (name !== difficulty) loadOnlineScores(name);
          }
        }
      }

      // the scenery scrolls (slowly on the menus)
      const scroll = gameState === "playing" ? speed : (gameState === "paused" ? 0 : 70);
      scrollScenery(scroll * dt);
      if (gameState !== "paused") dayTime = (dayTime + dt / (gameState === "playing" ? 90 : 120)) % 1;

      if (gameState !== "playing") return;

      const d = settings();
      playTime += dt;
      speed = Math.min(d.topSpeed, d.startSpeed + d.speedUp * playTime);
      const moved = speed * dt;
      distance += moved;

      // new things appear on the right
      nextObstacleIn -= moved;
      if (nextObstacleIn <= 0) {
        spawnObstacle();
        nextObstacleIn = speed * random(d.gapMin, d.gapMax);
      }
      nextStarsIn -= moved;
      if (nextStarsIn <= 0) {
        spawnStarRow();
        nextStarsIn = speed * random(1.6, 3.2);
      }
      nextDiscoveryIn -= moved;
      if (nextDiscoveryIn <= 0) {
        spawnDiscovery();
        nextDiscoveryIn = speed * random(7, 12);
      }
      nextBoxIn -= moved;
      if (nextBoxIn <= 0) {
        spawnBox();
        nextBoxIn = speed * random(11, 18);
      }

      // everything moves to the left
      for (const o of obstacles) {
        o.x -= (speed + o.extraSpeed) * dt;
        if (o.smashed) {                       // smashed things fly away spinning
          o.y -= 300 * dt;
          o.spin += dt * 12;
        }
        if (o.kind === "dog" && !o.barked && o.x < W - 40) {
          o.barked = true;
          sounds.woof();
        }
      }
      obstacles = obstacles.filter(function (o) { return o.x + o.w > -80 && o.y > -120; });
      for (const item of items) item.x -= speed * dt;

      for (const p of activePlayers()) {
        if (!p.alive) continue;

        // power-up timers
        p.invincible = Math.max(0, p.invincible - dt);
        p.helmet = Math.max(0, p.helmet - dt);
        p.skate = Math.max(0, p.skate - dt);
        p.magnet = Math.max(0, p.magnet - dt);
        p.double = Math.max(0, p.double - dt);
        const wasBalloon = p.balloon > 0;
        p.balloon = Math.max(0, p.balloon - dt);
        if (wasBalloon && p.balloon <= 0) {
          p.invincible = Math.max(p.invincible, 1);      // a safe landing
          p.onGround = false;
          p.vy = 0;
        }

        p.meters += moved / METER;
        p.runPhase += moved * 0.045;

        // move up and down
        if (p.balloon > 0) {                             // float high above everything
          p.y += (GROUND - 190 + Math.sin(clock * 3) * 8 - p.y) * Math.min(1, dt * 3);
          p.vy = 0;
          p.onGround = false;
          p.sliding = 0;
        } else {
          p.vy += GRAVITY * dt;
          p.y += p.vy * dt;
          if (p.y >= GROUND) {
            if (!p.onGround) {                           // just landed
              p.jumpsLeft = 2;
              dust(p.x, GROUND, 5);
              if (p.slideWhenLanding) {
                p.slideWhenLanding = false;
                p.sliding = 0.65;
                p.slides += 1;
                sounds.slide();
              }
            }
            p.y = GROUND;
            p.vy = 0;
            p.onGround = true;
          }
        }
        if (p.sliding > 0) p.sliding -= dt;

        // little dust clouds while running
        if (p.onGround) {
          p.dustTimer -= dt;
          if (p.dustTimer <= 0) {
            p.dustTimer = p.sliding > 0 ? 0.05 : 0.22;
            dust(p.x - 8, GROUND, 1);
          }
        }

        // bumping into obstacles
        const box = hitBox(p);
        for (const o of obstacles) {
          if (o.smashed || o.hitBy === p) continue;
          if (p.balloon > 0) continue;
          if (boxesTouch(box, { x: o.x, y: o.y, w: o.w, h: o.h })) {
            o.hitBy = p;                                 // only bump once per obstacle
            bump(p, o);
            if (!p.alive) break;
          }
        }
        if (!p.alive) continue;

        // picking things up (the magnet pulls them closer)
        const cx = p.x;
        const cy = (p.sliding > 0 && p.onGround) ? p.y - 18 : p.y - 45;
        for (const item of items) {
          if (item.gone) continue;
          if (p.magnet > 0 && item.kind !== "box") {
            const dx = cx - item.x;
            const dy = cy - item.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 250 && dist > 1) {
              item.x += dx / dist * 440 * dt;
              item.y += dy / dist * 440 * dt;
            }
          }
          if (Math.hypot(cx - item.x, cy - item.y) < item.r + 26) collect(item, p);
        }

        p.score = Math.floor(p.meters) + p.bonus;
      }
      items = items.filter(function (item) { return !item.gone && item.x > -40; });

      checkMission();

      // everyone out of hearts?
      if (!activePlayers().some(function (p) { return p.alive; })) endGame();
    }

    function scrollScenery(amount) {
      sceneryX += amount;
      for (const c of clouds) {
        c.x -= amount * 0.06;
        if (c.x < -120) { c.x = W + random(20, 140); c.y = random(110, 230); }
      }
      for (const h of houses) h.x -= amount * 0.45;
      houses = houses.filter(function (h) { return h.x + h.w > -60; });
      let last = houses.length ? Math.max.apply(null, houses.map(function (h) { return h.x + h.w; })) : 0;
      while (last < W + 140) last = addHouse(last + random(14, 40));
      for (const t of trees) t.x -= amount * 0.8;
      trees = trees.filter(function (t) { return t.x > -80; });
      let lastTree = trees.length ? trees[trees.length - 1].x : 0;
      while (lastTree < W + 140) {
        lastTree += random(150, 260);
        trees.push({ x: lastTree, lamp: Math.random() < 0.4, size: random(0.85, 1.15) });
      }
    }

    // ---------------------------------------------------------------
    // 5. DRAW
    // ---------------------------------------------------------------
    // a rounded rectangle path
    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      pen.beginPath();
      pen.moveTo(x + r, y);
      pen.arcTo(x + w, y, x + w, y + h, r);
      pen.arcTo(x + w, y + h, x, y + h, r);
      pen.arcTo(x, y + h, x, y, r);
      pen.arcTo(x, y, x + w, y, r);
      pen.closePath();
    }

    // fill a shape, then give it a dark cartoon outline
    function fillAndInk(color, width) {
      pen.fillStyle = color;
      pen.fill();
      pen.strokeStyle = INK;
      pen.lineWidth = width || 2.5;
      pen.lineJoin = "round";
      pen.stroke();
    }

    // a soft shadow on the ground (smaller when the thing is higher up)
    function shadow(x, width, height) {
      const fade = Math.max(0.15, 1 - height / 200);
      pen.fillStyle = "rgba(20, 20, 40, " + 0.28 * fade + ")";
      pen.beginPath();
      pen.ellipse(x, GROUND + 4, width * fade, 5 * fade, 0, 0, Math.PI * 2);
      pen.fill();
    }

    // the sky changes through the day: day, sunset, night, sunrise
    const SKY = [
      { t: 0.00, top: "#3a9ff0", mid: "#7cc8f7", low: "#d6f1ff" },
      { t: 0.40, top: "#3a9ff0", mid: "#7cc8f7", low: "#d6f1ff" },
      { t: 0.50, top: "#5b4b9a", mid: "#ff7e67", low: "#ffd29c" },
      { t: 0.58, top: "#070a24", mid: "#141a46", low: "#2b2f63" },
      { t: 0.88, top: "#070a24", mid: "#141a46", low: "#2b2f63" },
      { t: 0.95, top: "#6c5b9e", mid: "#f7a6c4", low: "#ffe1b3" },
      { t: 1.00, top: "#3a9ff0", mid: "#7cc8f7", low: "#d6f1ff" }
    ];

    function mixColor(a, b, k) {
      const pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
      const pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
      return "rgb(" + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * k); }).join(",") + ")";
    }

    function skyNow() {
      for (let i = 0; i < SKY.length - 1; i++) {
        const a = SKY[i];
        const b = SKY[i + 1];
        if (dayTime >= a.t && dayTime <= b.t) {
          const k = (dayTime - a.t) / (b.t - a.t || 1);
          return { top: mixColor(a.top, b.top, k), mid: mixColor(a.mid, b.mid, k), low: mixColor(a.low, b.low, k) };
        }
      }
      return SKY[0];
    }

    // how dark it is (0 = day, 1 = night)
    function nightness() {
      if (dayTime < 0.45) return 0;
      if (dayTime < 0.58) return (dayTime - 0.45) / 0.13;
      if (dayTime < 0.88) return 1;
      if (dayTime < 0.96) return 1 - (dayTime - 0.88) / 0.08;
      return 0;
    }

    function drawSky() {
      const sky = skyNow();
      const gradient = pen.createLinearGradient(0, 0, 0, GROUND);
      gradient.addColorStop(0, sky.top);
      gradient.addColorStop(0.55, sky.mid);
      gradient.addColorStop(1, sky.low);
      pen.fillStyle = gradient;
      pen.fillRect(0, 0, W, H);

      const dark = nightness();
      if (dark > 0) {                                        // twinkling stars at night
        for (let i = 0; i < 60; i++) {
          const sx = (i * 97 + 13) % W;
          const sy = (i * 53 + 29) % 300;
          const twinkle = 0.5 + 0.5 * Math.sin(clock * 3 + i);
          pen.fillStyle = "rgba(255, 255, 255, " + dark * (0.4 + 0.6 * twinkle) + ")";
          pen.fillRect(sx, sy, i % 6 === 0 ? 2.2 : 1.3, i % 6 === 0 ? 2.2 : 1.3);
        }
      }

      // sun (day) or moon (night), moving across the sky
      const isSun = dayTime < 0.55;
      const arc = isSun ? dayTime / 0.55 : (dayTime - 0.55) / 0.45;
      const bx = 40 + arc * 400;
      const by = 230 - Math.sin(arc * Math.PI) * 150;
      const glow = pen.createRadialGradient(bx, by, 8, bx, by, isSun ? 90 : 60);
      glow.addColorStop(0, isSun ? "rgba(255, 240, 160, 0.7)" : "rgba(220, 230, 255, 0.4)");
      glow.addColorStop(1, "rgba(255, 240, 160, 0)");
      pen.fillStyle = glow;
      pen.fillRect(bx - 90, by - 90, 180, 180);
      if (isSun) {
        pen.save();                                          // slowly turning sun rays
        pen.translate(bx, by);
        pen.rotate(clock * 0.2);
        pen.fillStyle = "rgba(255, 226, 102, 0.55)";
        for (let i = 0; i < 12; i++) {
          pen.rotate(Math.PI / 6);
          pen.beginPath();
          pen.moveTo(-4, -34);
          pen.lineTo(0, -48);
          pen.lineTo(4, -34);
          pen.fill();
        }
        pen.restore();
        const sun = pen.createRadialGradient(bx - 8, by - 8, 4, bx, by, 28);
        sun.addColorStop(0, "#fff7c2");
        sun.addColorStop(1, "#ffcf3f");
        pen.fillStyle = sun;
        pen.beginPath();
        pen.arc(bx, by, 28, 0, Math.PI * 2);
        pen.fill();
      } else {
        pen.fillStyle = "#f4f1de";
        pen.beginPath();
        pen.arc(bx, by, 22, 0, Math.PI * 2);
        pen.fill();
        pen.fillStyle = "rgba(180, 175, 160, 0.6)";               // craters
        pen.beginPath();
        pen.arc(bx - 7, by - 5, 4, 0, Math.PI * 2);
        pen.arc(bx + 6, by + 6, 5, 0, Math.PI * 2);
        pen.arc(bx + 8, by - 9, 2.5, 0, Math.PI * 2);
        pen.fill();
      }

      for (const c of clouds) drawCloud(c, dark);
    }

    function drawCloud(c, dark) {
      const s = c.size;
      const body = pen.createLinearGradient(0, c.y - 30 * s, 0, c.y + 16 * s);
      const light = 1 - dark * 0.6;
      body.addColorStop(0, "rgba(255, 255, 255, " + 0.95 * light + ")");
      body.addColorStop(1, "rgba(214, 228, 245, " + 0.95 * light + ")");
      pen.fillStyle = body;
      pen.beginPath();
      pen.arc(c.x - 26 * s, c.y, 18 * s, 0, Math.PI * 2);
      pen.arc(c.x - 6 * s, c.y - 14 * s, 24 * s, 0, Math.PI * 2);
      pen.arc(c.x + 20 * s, c.y - 6 * s, 20 * s, 0, Math.PI * 2);
      pen.arc(c.x + 38 * s, c.y + 2 * s, 14 * s, 0, Math.PI * 2);
      pen.rect(c.x - 26 * s, c.y, 64 * s, 16 * s);
      pen.fill();
    }

    function drawHills() {
      // far hills (misty)
      pen.fillStyle = "#9ed5a6";
      pen.beginPath();
      pen.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 8) {
        pen.lineTo(x, GROUND - 150 - Math.sin((x + sceneryX * 0.1) / 90) * 26 - Math.sin((x + sceneryX * 0.1) / 37) * 9);
      }
      pen.lineTo(W, GROUND);
      pen.fill();
      // near hills with little trees
      const near = pen.createLinearGradient(0, GROUND - 140, 0, GROUND);
      near.addColorStop(0, "#74c47a");
      near.addColorStop(1, "#4fa35a");
      pen.fillStyle = near;
      pen.beginPath();
      pen.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 8) {
        pen.lineTo(x, GROUND - 105 - Math.sin((x + sceneryX * 0.2) / 70) * 20 - Math.sin((x + sceneryX * 0.2) / 29) * 7);
      }
      pen.lineTo(W, GROUND);
      pen.fill();
      pen.fillStyle = "#3d8a49";
      for (let i = 0; i < 12; i++) {
        const tx = ((i * 83 - sceneryX * 0.2) % (W + 60) + W + 60) % (W + 60) - 30;
        const ty = GROUND - 105 - Math.sin((tx + sceneryX * 0.2) / 70) * 20 - Math.sin((tx + sceneryX * 0.2) / 29) * 7;
        pen.beginPath();
        pen.moveTo(tx, ty - 16);
        pen.lineTo(tx + 6, ty + 2);
        pen.lineTo(tx - 6, ty + 2);
        pen.fill();
      }
    }

    function windowSpots(h) {
      const top = GROUND - 6 - h.h;
      const spots = [];
      for (let i = 0; i < h.windows; i++) {
        const wx = h.windows === 1 ? h.x + h.w / 2 - 11 : h.x + 12 + i * (h.w - 46);
        spots.push({ x: wx, y: top + 16 });
      }
      return spots;
    }

    function drawHouse(h, dark) {
      const base = GROUND - 6;
      if (h.sign) {                                           // the town sign
        pen.fillStyle = "#8d6e63";
        pen.fillRect(h.x + 20, base - 52, 7, 52);
        pen.fillRect(h.x + 69, base - 52, 7, 52);
        roundRect(h.x, base - 86, 96, 42, 6);
        fillAndInk("#fff8e1", 3);
        pen.fillStyle = "#5d4037";
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.font = font(11, 600);
        pen.fillText("WELCOME TO", h.x + 48, base - 74);
        pen.font = font(16, 700);
        pen.fillText("TINY TOWN", h.x + 48, base - 56);
        return;
      }
      const top = base - h.h;
      // chimney (with smoke puffs)
      if (h.chimney) {
        const cx = h.x + h.w * 0.68;
        pen.beginPath();
        pen.rect(cx, top - 36, 14, 30);
        fillAndInk("#a1887f", 2);
        for (let i = 0; i < 3; i++) {
          const rise = (clock * 18 + i * 16) % 48;
          pen.fillStyle = "rgba(240, 240, 245, " + (0.55 * (1 - rise / 48)) + ")";
          pen.beginPath();
          pen.arc(cx + 7 + Math.sin(rise / 9) * 4, top - 40 - rise, 5 + rise / 8, 0, Math.PI * 2);
          pen.fill();
        }
      }
      // walls
      const wall = pen.createLinearGradient(0, top, 0, base);
      wall.addColorStop(0, h.color);
      wall.addColorStop(1, mixColor(h.color.length === 7 ? h.color : "#ffffff", "#000000", 0.12));
      pen.beginPath();
      pen.rect(h.x, top, h.w, h.h);
      pen.fillStyle = wall;
      pen.fill();
      pen.strokeStyle = INK;
      pen.lineWidth = 2;
      pen.stroke();
      // roof with shingle lines
      pen.beginPath();
      pen.moveTo(h.x - 10, top + 2);
      pen.lineTo(h.x + h.w / 2, top - h.w * 0.42);
      pen.lineTo(h.x + h.w + 10, top + 2);
      pen.closePath();
      fillAndInk(h.roof, 2);
      pen.strokeStyle = "rgba(0, 0, 0, 0.18)";
      pen.lineWidth = 1.5;
      for (let i = 1; i < 4; i++) {
        const y = top + 2 - (h.w * 0.42) * (i / 4);
        const half = (h.w / 2 + 10) * (1 - i / 4);
        pen.beginPath();
        pen.moveTo(h.x + h.w / 2 - half, y);
        pen.lineTo(h.x + h.w / 2 + half, y);
        pen.stroke();
      }
      if (h.round) {                                          // round attic window
        pen.beginPath();
        pen.arc(h.x + h.w / 2, top - h.w * 0.14, 6, 0, Math.PI * 2);
        fillAndInk(dark > 0.5 ? "#ffd666" : "#d6f1ff", 1.5);
      }
      // windows with frames
      for (const s of windowSpots(h)) {
        pen.beginPath();
        pen.rect(s.x, s.y, 22, 20);
        fillAndInk(dark > 0.5 ? "#2b2f55" : "#bfe6ff", 2);
        if (dark <= 0.5) {
          pen.fillStyle = "rgba(255, 255, 255, 0.7)";        // shine
          pen.beginPath();
          pen.moveTo(s.x + 3, s.y + 15);
          pen.lineTo(s.x + 12, s.y + 3);
          pen.lineTo(s.x + 15, s.y + 3);
          pen.lineTo(s.x + 6, s.y + 15);
          pen.fill();
        }
        pen.strokeStyle = INK;
        pen.lineWidth = 1.5;
        pen.beginPath();
        pen.moveTo(s.x + 11, s.y);
        pen.lineTo(s.x + 11, s.y + 20);
        pen.moveTo(s.x, s.y + 10);
        pen.lineTo(s.x + 22, s.y + 10);
        pen.stroke();
        pen.fillStyle = "rgba(255, 255, 255, 0.85)";          // window sill
        pen.fillRect(s.x - 2, s.y + 20, 26, 3);
      }
      // door with a rounded top
      const dx = h.x + h.w / 2 - 10;
      pen.beginPath();
      pen.moveTo(dx, base);
      pen.lineTo(dx, base - 22);
      pen.arc(dx + 10, base - 22, 10, Math.PI, 0);
      pen.lineTo(dx + 20, base);
      pen.closePath();
      fillAndInk("#8a5a32", 2);
      pen.fillStyle = "#ffd23f";
      pen.beginPath();
      pen.arc(dx + 15, base - 14, 2, 0, Math.PI * 2);
      pen.fill();
      // garden: a bush and some flowers
      if (h.bush) {
        pen.beginPath();
        pen.arc(h.x + 8, base - 6, 10, 0, Math.PI * 2);
        pen.arc(h.x + 20, base - 9, 12, 0, Math.PI * 2);
        fillAndInk("#3f9b4a", 2);
      }
      if (h.flowers) {
        for (let i = 0; i < 4; i++) {
          const fx = h.x + h.w - 12 - i * 7;
          pen.strokeStyle = "#2f7d3a";
          pen.lineWidth = 1.5;
          pen.beginPath();
          pen.moveTo(fx, base);
          pen.lineTo(fx, base - 9);
          pen.stroke();
          pen.fillStyle = h.flowerColor;
          pen.beginPath();
          pen.arc(fx, base - 10, 3, 0, Math.PI * 2);
          pen.fill();
        }
      }
    }

    function drawWindowLights(h, dark) {
      if (h.sign) return;
      for (const s of windowSpots(h)) {
        const glow = pen.createRadialGradient(s.x + 11, s.y + 10, 2, s.x + 11, s.y + 10, 34);
        glow.addColorStop(0, "rgba(255, 214, 102, " + 0.45 * dark + ")");
        glow.addColorStop(1, "rgba(255, 214, 102, 0)");
        pen.fillStyle = glow;
        pen.fillRect(s.x - 24, s.y - 24, 70, 68);
        pen.fillStyle = "rgba(255, 214, 102, " + dark + ")";
        pen.fillRect(s.x + 1, s.y + 1, 20, 18);
        pen.strokeStyle = "rgba(60, 40, 20, " + dark + ")";
        pen.lineWidth = 1.5;
        pen.beginPath();
        pen.moveTo(s.x + 11, s.y);
        pen.lineTo(s.x + 11, s.y + 20);
        pen.moveTo(s.x, s.y + 10);
        pen.lineTo(s.x + 22, s.y + 10);
        pen.stroke();
      }
    }

    function drawTree(t) {
      if (t.lamp) {                                           // street lamp
        pen.fillStyle = "#3d405b";
        pen.fillRect(t.x, GROUND - 100, 6, 100);
        pen.beginPath();
        pen.moveTo(t.x + 3, GROUND - 100);
        pen.quadraticCurveTo(t.x + 3, GROUND - 116, t.x + 18, GROUND - 112);
        pen.strokeStyle = "#3d405b";
        pen.lineWidth = 5;
        pen.stroke();
        roundRect(t.x + 12, GROUND - 114, 16, 10, 3);
        fillAndInk("#fff3b0", 2);
        return;
      }
      const s = t.size;
      const trunk = pen.createLinearGradient(t.x - 6, 0, t.x + 6, 0);
      trunk.addColorStop(0, "#8a5a32");
      trunk.addColorStop(1, "#6b4423");
      pen.fillStyle = trunk;
      pen.beginPath();
      pen.rect(t.x - 5 * s, GROUND - 52 * s, 10 * s, 52 * s);
      pen.fill();
      pen.strokeStyle = INK;
      pen.lineWidth = 2;
      pen.stroke();
      pen.beginPath();                                        // leafy crown
      pen.arc(t.x, GROUND - 74 * s, 26 * s, 0, Math.PI * 2);
      pen.arc(t.x - 19 * s, GROUND - 56 * s, 18 * s, 0, Math.PI * 2);
      pen.arc(t.x + 19 * s, GROUND - 56 * s, 18 * s, 0, Math.PI * 2);
      fillAndInk("#3f9b4a", 2.5);
      pen.fillStyle = "rgba(160, 230, 140, 0.55)";             // sunny highlight
      pen.beginPath();
      pen.arc(t.x - 8 * s, GROUND - 84 * s, 10 * s, 0, Math.PI * 2);
      pen.fill();
    }

    function drawLampGlow(t, dark) {
      const glow = pen.createRadialGradient(t.x + 20, GROUND - 106, 2, t.x + 20, GROUND - 106, 75);
      glow.addColorStop(0, "rgba(255, 236, 150, " + 0.75 * dark + ")");
      glow.addColorStop(1, "rgba(255, 236, 150, 0)");
      pen.fillStyle = glow;
      pen.fillRect(t.x - 60, GROUND - 180, 160, 180);
    }

    function drawStreet() {
      // grass edge
      pen.fillStyle = "#5fb35a";
      pen.fillRect(0, GROUND - 8, W, 10);
      pen.fillStyle = "#4b9a47";
      for (let x = -(sceneryX % 12); x < W; x += 12) {
        pen.beginPath();
        pen.moveTo(x, GROUND - 6);
        pen.lineTo(x + 3, GROUND - 13);
        pen.lineTo(x + 6, GROUND - 6);
        pen.fill();
      }
      // sidewalk tiles
      const walk = pen.createLinearGradient(0, GROUND, 0, GROUND + 36);
      walk.addColorStop(0, "#ece6d8");
      walk.addColorStop(1, "#d3cbb8");
      pen.fillStyle = walk;
      pen.fillRect(0, GROUND, W, 36);
      pen.fillStyle = "rgba(120, 110, 90, 0.35)";
      for (let x = -(sceneryX % 48); x < W; x += 48) pen.fillRect(x, GROUND, 2, 36);
      pen.fillRect(0, GROUND + 17, W, 1.5);
      // curb
      pen.fillStyle = "#b8b1a2";
      pen.fillRect(0, GROUND + 36, W, 5);
      pen.fillStyle = "#8a8578";
      pen.fillRect(0, GROUND + 41, W, 5);
      // road
      const road = pen.createLinearGradient(0, GROUND + 46, 0, H);
      road.addColorStop(0, "#4a4e5a");
      road.addColorStop(1, "#3a3d47");
      pen.fillStyle = road;
      pen.fillRect(0, GROUND + 46, W, H - GROUND - 46);
      pen.fillStyle = "#f2d14b";
      for (let x = -(sceneryX % 80); x < W; x += 80) {
        roundRect(x, GROUND + 84, 42, 6, 3);
        pen.fill();
      }
    }

    function drawScenery() {
      drawSky();
      drawHills();
      const dark = nightness();
      for (const h of houses) drawHouse(h, dark);
      for (const t of trees) drawTree(t);
      drawStreet();
      if (dark > 0) {                                         // darker at night...
        pen.fillStyle = "rgba(5, 8, 35, " + dark * 0.42 + ")";
        pen.fillRect(0, 0, W, H);
        for (const h of houses) drawWindowLights(h, dark);    // ...but the lights come on
        for (const t of trees) if (t.lamp) drawLampGlow(t, dark);
      }
      // speed lines when going really fast
      if (gameState === "playing" && speed > 470) {
        const amount = Math.min(1, (speed - 470) / 200);
        pen.strokeStyle = "rgba(255, 255, 255, " + 0.35 * amount + ")";
        pen.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const ly = 130 + ((i * 71) % 300);
          const lx = W - ((clock * 900 + i * 137) % (W + 200));
          pen.beginPath();
          pen.moveTo(lx, ly);
          pen.lineTo(lx + 60, ly);
          pen.stroke();
        }
      }
    }

    // OBSTACLES: bold colors and dark outlines so they're easy to spot
    function drawObstacle(o) {
      const air = OBSTACLE_TYPES[o.kind].air;
      if (!o.smashed) shadow(o.x + o.w / 2, o.w * 0.55, air ? GROUND - (o.y + o.h) : 0);
      pen.save();
      if (o.smashed) {
        pen.translate(o.x + o.w / 2, o.y + o.h / 2);
        pen.rotate(o.spin);
        pen.translate(-(o.x + o.w / 2), -(o.y + o.h / 2));
      }
      const x = o.x;
      const y = o.y;
      const w = o.w;
      const h = o.h;
      if (o.kind === "can") {
        const metal = pen.createLinearGradient(x, 0, x + w, 0);
        metal.addColorStop(0, "#7d8ca3");
        metal.addColorStop(0.45, "#c9d3e0");
        metal.addColorStop(1, "#6b7a90");
        roundRect(x + 2, y + 8, w - 4, h - 8, 4);
        fillAndInk(metal, 2.5);
        pen.strokeStyle = "rgba(29, 27, 47, 0.45)";
        pen.lineWidth = 2;
        for (let i = 1; i < 4; i++) {
          pen.beginPath();
          pen.moveTo(x + i * (w / 4), y + 14);
          pen.lineTo(x + i * (w / 4), y + h - 5);
          pen.stroke();
        }
        roundRect(x - 2, y + 1, w + 4, 9, 3);
        fillAndInk("#5c6b82", 2.5);
        roundRect(x + w / 2 - 6, y - 4, 12, 6, 2);
        fillAndInk("#5c6b82", 2);
      } else if (o.kind === "cone") {
        pen.beginPath();
        pen.moveTo(x + w / 2 - 3, y);
        pen.lineTo(x + w / 2 + 3, y);
        pen.lineTo(x + w - 3, y + h - 6);
        pen.lineTo(x + 3, y + h - 6);
        pen.closePath();
        fillAndInk("#ff7a1a", 2.5);
        pen.fillStyle = "white";
        pen.beginPath();
        pen.moveTo(x + w * 0.36, y + h * 0.3);
        pen.lineTo(x + w * 0.64, y + h * 0.3);
        pen.lineTo(x + w * 0.7, y + h * 0.45);
        pen.lineTo(x + w * 0.3, y + h * 0.45);
        pen.fill();
        pen.beginPath();
        pen.moveTo(x + w * 0.25, y + h * 0.6);
        pen.lineTo(x + w * 0.75, y + h * 0.6);
        pen.lineTo(x + w * 0.8, y + h * 0.72);
        pen.lineTo(x + w * 0.2, y + h * 0.72);
        pen.fill();
        roundRect(x - 3, y + h - 7, w + 6, 7, 2);
        fillAndInk("#d95f00", 2.5);
      } else if (o.kind === "puddle") {
        pen.beginPath();
        pen.ellipse(x + w / 2, y + 6, w / 2, 8, 0, 0, Math.PI * 2);
        fillAndInk("#3d8bfd", 2.5);
        const ripple = (clock * 1.5 + o.seed) % 1;              // ripples
        pen.strokeStyle = "rgba(255, 255, 255, " + (0.8 * (1 - ripple)) + ")";
        pen.lineWidth = 1.5;
        pen.beginPath();
        pen.ellipse(x + w / 2, y + 6, 6 + ripple * 26, 2 + ripple * 4, 0, 0, Math.PI * 2);
        pen.stroke();
        pen.fillStyle = "rgba(255, 255, 255, 0.85)";
        roundRect(x + 14, y + 3, 16, 3, 1.5);
        pen.fill();
        pen.fillStyle = "#3d8bfd";                             // splash drops
        for (let i = 0; i < 3; i++) {
          pen.beginPath();
          pen.arc(x + 18 + i * 18, y - 4 - Math.abs(Math.sin(clock * 5 + i)) * 5, 2.5, 0, Math.PI * 2);
          pen.fill();
        }
      } else if (o.kind === "fence") {
        roundRect(x - 2, y + 13, w + 4, 6, 2);
        fillAndInk("#fff6e0", 2);
        roundRect(x - 2, y + 28, w + 4, 6, 2);
        fillAndInk("#fff6e0", 2);
        for (let i = 0; i < 4; i++) {
          const px = x + 2 + i * 14;
          pen.beginPath();
          pen.moveTo(px, y + h);
          pen.lineTo(px, y + 8);
          pen.lineTo(px + 5, y);
          pen.lineTo(px + 10, y + 8);
          pen.lineTo(px + 10, y + h);
          pen.closePath();
          fillAndInk("#fffaf0", 2.5);
        }
      } else if (o.kind === "dog") {
        drawDog(o);
      } else if (o.kind === "bike") {
        drawBike(o);
      } else if (o.kind === "bird") {
        drawBird(o);
      } else if (o.kind === "branch") {
        pen.strokeStyle = "rgba(61, 138, 73, 0.9)";            // vines up to the tree above
        pen.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          pen.beginPath();
          pen.moveTo(x + 14 + i * 32, y + 4);
          pen.quadraticCurveTo(x + 22 + i * 32, y - 60, x + 10 + i * 32, y - 140);
          pen.stroke();
        }
        roundRect(x - 12, y + 8, w + 24, 11, 5);
        fillAndInk("#8a5a32", 2.5);
        pen.strokeStyle = "rgba(29, 27, 47, 0.35)";            // bark lines
        pen.lineWidth = 1.5;
        for (let i = 0; i < 5; i++) {
          pen.beginPath();
          pen.moveTo(x + i * 22, y + 11);
          pen.lineTo(x + i * 22 + 10, y + 15);
          pen.stroke();
        }
        for (let i = 0; i < 7; i++) {                           // leaves
          pen.beginPath();
          pen.ellipse(x + i * 14 + 2, y + 6 + (i % 2) * 14, 10, 6, (i % 2 ? 0.5 : -0.5), 0, Math.PI * 2);
          fillAndInk(i % 3 === 0 ? "#57b35e" : "#3f9b4a", 2);
        }
      }
      pen.restore();
    }

    function drawDog(o) {
      const x = o.x;
      const y = o.y;
      const step = Math.sin(clock * 18 + o.seed * 6);
      const bounce = Math.abs(step) * -2;
      pen.save();
      pen.translate(0, bounce);
      pen.strokeStyle = INK;                                  // legs
      pen.lineWidth = 6;
      pen.lineCap = "round";
      const legs = [[x + 14, step], [x + 22, -step], [x + 38, -step], [x + 46, step]];
      for (const leg of legs) {
        pen.beginPath();
        pen.moveTo(leg[0], y + 26);
        pen.lineTo(leg[0] + leg[1] * 5, y + 38);
        pen.stroke();
      }
      pen.strokeStyle = "#b5753c";
      pen.lineWidth = 3.5;
      for (const leg of legs) {
        pen.beginPath();
        pen.moveTo(leg[0], y + 26);
        pen.lineTo(leg[0] + leg[1] * 5, y + 38);
        pen.stroke();
      }
      pen.save();                                             // wagging tail
      pen.translate(x + 52, y + 16);
      pen.rotate(-0.6 + Math.sin(clock * 22) * 0.5);
      roundRect(-2, -14, 5, 15, 2.5);
      fillAndInk("#b5753c", 2);
      pen.restore();
      pen.beginPath();                                        // body
      pen.ellipse(x + 32, y + 20, 22, 12, 0, 0, Math.PI * 2);
      fillAndInk("#c98a4b", 2.5);
      pen.fillStyle = "#f0d3a8";
      pen.beginPath();
      pen.ellipse(x + 30, y + 25, 13, 5, 0, 0, Math.PI * 2);
      pen.fill();
      pen.beginPath();                                        // head
      pen.arc(x + 11, y + 10, 11, 0, Math.PI * 2);
      fillAndInk("#c98a4b", 2.5);
      pen.beginPath();                                        // snout
      pen.ellipse(x + 2, y + 14, 7, 5, 0, 0, Math.PI * 2);
      fillAndInk("#f0d3a8", 2);
      pen.fillStyle = INK;
      pen.beginPath();
      pen.arc(x - 3, y + 12, 2.5, 0, Math.PI * 2);            // nose
      pen.arc(x + 9, y + 6, 2, 0, Math.PI * 2);               // eye
      pen.fill();
      pen.beginPath();                                        // floppy ear
      pen.ellipse(x + 17, y + 9, 5, 9, 0.5, 0, Math.PI * 2);
      fillAndInk("#8a5a32", 2);
      pen.fillStyle = "#e63946";                              // collar
      pen.fillRect(x + 17, y + 14, 5, 9);
      pen.restore();
      if (o.x < W - 20 && o.x > 200) {                       // WOOF!
        pen.font = font(13, 700);
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        outlinedText("WOOF!", x + 8, y - 14 + Math.sin(clock * 12) * 2, "#fff3b0");
      }
    }

    function drawBike(o) {
      const x = o.x;
      const y = o.y;
      const wheel = function (cx) {
        pen.beginPath();
        pen.arc(cx, y + 32, 13, 0, Math.PI * 2);
        pen.strokeStyle = INK;
        pen.lineWidth = 5;
        pen.stroke();
        pen.strokeStyle = "#8a8f9c";
        pen.lineWidth = 1.2;
        for (let i = 0; i < 4; i++) {
          const a = i * Math.PI / 4 + clock * 0;
          pen.beginPath();
          pen.moveTo(cx + Math.cos(a) * 11, y + 32 + Math.sin(a) * 11);
          pen.lineTo(cx - Math.cos(a) * 11, y + 32 - Math.sin(a) * 11);
          pen.stroke();
        }
      };
      wheel(x + 14);
      wheel(x + 52);
      pen.lineCap = "round";
      pen.lineJoin = "round";
      const frame = [[x + 14, y + 32], [x + 28, y + 14], [x + 46, y + 14], [x + 52, y + 32]];
      for (const pass of [[INK, 7], ["#e63946", 4]]) {
        pen.strokeStyle = pass[0];
        pen.lineWidth = pass[1];
        pen.beginPath();
        pen.moveTo(frame[0][0], frame[0][1]);
        pen.lineTo(frame[1][0], frame[1][1]);
        pen.lineTo(frame[2][0], frame[2][1]);
        pen.lineTo(frame[3][0], frame[3][1]);
        pen.moveTo(frame[1][0], frame[1][1]);
        pen.lineTo(x + 32, y + 32);
        pen.lineTo(frame[2][0], frame[2][1]);
        pen.moveTo(x + 46, y + 14);
        pen.lineTo(x + 44, y + 4);
        pen.stroke();
      }
      roundRect(x + 22, y + 6, 14, 5, 2);                     // seat
      fillAndInk("#3d405b", 2);
      pen.strokeStyle = INK;                                  // handlebar
      pen.lineWidth = 4;
      pen.beginPath();
      pen.moveTo(x + 38, y + 4);
      pen.lineTo(x + 50, y + 2);
      pen.stroke();
      pen.fillStyle = "#ffd23f";                              // bell
      pen.beginPath();
      pen.arc(x + 48, y + 7, 2.5, 0, Math.PI * 2);
      pen.fill();
    }

    function drawBird(o) {
      const x = o.x + o.w / 2;
      const y = o.y + o.h / 2 + Math.sin(clock * 6 + o.seed * 9) * 3;
      const flap = Math.sin(clock * 22 + o.seed * 4);
      pen.beginPath();                                        // back wing
      pen.moveTo(x + 2, y - 2);
      pen.quadraticCurveTo(x + 14, y - 14 - flap * 10, x + 20, y - 4 - flap * 12);
      pen.lineTo(x + 8, y + 2);
      pen.closePath();
      fillAndInk("#c1121f", 2);
      pen.beginPath();                                        // body
      pen.ellipse(x, y + 2, 16, 11, 0, 0, Math.PI * 2);
      fillAndInk("#e63946", 2.5);
      pen.beginPath();                                        // tail
      pen.moveTo(x + 14, y + 2);
      pen.lineTo(x + 26, y - 4);
      pen.lineTo(x + 25, y + 9);
      pen.closePath();
      fillAndInk("#c1121f", 2);
      pen.beginPath();                                        // crest
      pen.moveTo(x - 8, y - 7);
      pen.lineTo(x - 4, y - 17);
      pen.lineTo(x - 1, y - 8);
      pen.closePath();
      fillAndInk("#e63946", 2);
      pen.beginPath();                                        // beak
      pen.moveTo(x - 15, y);
      pen.lineTo(x - 24, y + 3);
      pen.lineTo(x - 15, y + 6);
      pen.closePath();
      fillAndInk("#ffb703", 2);
