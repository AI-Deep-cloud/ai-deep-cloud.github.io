      pen.fillStyle = "white";                                // eye
      pen.beginPath();
      pen.arc(x - 8, y - 1, 3.5, 0, Math.PI * 2);
      pen.fill();
      pen.fillStyle = INK;
      pen.beginPath();
      pen.arc(x - 9, y - 1, 1.8, 0, Math.PI * 2);
      pen.fill();
      pen.beginPath();                                        // front wing
      pen.moveTo(x - 2, y);
      pen.quadraticCurveTo(x + 6, y + 8 + flap * 10, x + 14, y + 4 + flap * 14);
      pen.lineTo(x + 6, y - 2);
      pen.closePath();
      fillAndInk("#ff6b6b", 2);
    }

    // a shiny 5-pointed star
    function starPath(cx, cy, outer, inner) {
      pen.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        pen.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      pen.closePath();
    }

    function drawItem(item) {
      if (item.kind === "star") {
        const y = item.y + Math.sin(clock * 6 + item.x / 40) * 2;
        const turn = Math.cos(clock * 4 + item.x / 30);           // spins like a coin
        const glow = pen.createRadialGradient(item.x, y, 2, item.x, y, 20);
        glow.addColorStop(0, "rgba(255, 230, 120, 0.55)");
        glow.addColorStop(1, "rgba(255, 230, 120, 0)");
        pen.fillStyle = glow;
        pen.fillRect(item.x - 20, y - 20, 40, 40);
        pen.save();
        pen.translate(item.x, y);
        pen.scale(Math.max(0.25, Math.abs(turn)), 1);
        const gold = pen.createLinearGradient(0, -12, 0, 12);
        gold.addColorStop(0, "#fff3a0");
        gold.addColorStop(1, "#ffb703");
        starPath(0, 0, 12, 5.5);
        fillAndInk(gold, 2);
        pen.restore();
      } else if (item.kind === "discovery") {
        const rarity = RARITY[item.discovery.rarity];
        const pulse = 0.35 + 0.2 * Math.sin(clock * 6);
        pen.save();                                               // turning light rays
        pen.translate(item.x, item.y);
        pen.rotate(clock * 0.8);
        pen.fillStyle = "rgba(" + rarity.color + ", " + pulse * 0.6 + ")";
        for (let i = 0; i < 8; i++) {
          pen.rotate(Math.PI / 4);
          pen.beginPath();
          pen.moveTo(-4, 0);
          pen.lineTo(0, -34);
          pen.lineTo(4, 0);
          pen.fill();
        }
        pen.restore();
        const glow = pen.createRadialGradient(item.x, item.y, 4, item.x, item.y, 28);
        glow.addColorStop(0, "rgba(" + rarity.color + ", " + (pulse + 0.25) + ")");
        glow.addColorStop(1, "rgba(" + rarity.color + ", 0)");
        pen.fillStyle = glow;
        pen.fillRect(item.x - 28, item.y - 28, 56, 56);
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        pen.font = "30px sans-serif";
        pen.fillText(item.discovery.picture, item.x, item.y + 1);
      } else if (item.kind === "box") {
        const bob = Math.sin(clock * 4) * 4;
        const x = item.x;
        const y = item.y + bob;
        const glow = pen.createRadialGradient(x, y, 6, x, y, 34);
        glow.addColorStop(0, "rgba(255, 215, 94, " + (0.45 + 0.2 * Math.sin(clock * 8)) + ")");
        glow.addColorStop(1, "rgba(255, 215, 94, 0)");
        pen.fillStyle = glow;
        pen.fillRect(x - 34, y - 34, 68, 68);
        pen.beginPath();                                          // top face
        pen.moveTo(x - 16, y - 12);
        pen.lineTo(x - 8, y - 20);
        pen.lineTo(x + 20, y - 20);
        pen.lineTo(x + 16, y - 12);
        pen.closePath();
        fillAndInk("#e0a96d", 2);
        pen.beginPath();                                          // side face
        pen.moveTo(x + 16, y - 12);
        pen.lineTo(x + 20, y - 20);
        pen.lineTo(x + 20, y + 10);
        pen.lineTo(x + 16, y + 18);
        pen.closePath();
        fillAndInk("#9c6436", 2);
        pen.beginPath();                                          // front face
        pen.rect(x - 16, y - 12, 32, 30);
        fillAndInk("#c58b4d", 2.5);
        pen.strokeStyle = "rgba(29, 27, 47, 0.35)";
        pen.lineWidth = 1.5;
        pen.beginPath();
        pen.moveTo(x - 16, y - 2);
        pen.lineTo(x + 16, y - 2);
        pen.moveTo(x - 16, y + 8);
        pen.lineTo(x + 16, y + 8);
        pen.stroke();
        pen.font = font(22, 700);
        pen.textAlign = "center";
        pen.textBaseline = "middle";
        outlinedText("?", x, y + 4 + Math.sin(clock * 10) * 1.5, "#fff3b0");
      }
    }

    // JAHAN (and the buddy): an explorer kid with a backpack and a magnifying glass
    function drawKid(p) {
      const sliding = p.sliding > 0 && p.onGround;
      shadow(p.x, sliding ? 30 : 20, GROUND - p.y);
      if (p.invincible > 0 && Math.sin(clock * 30) > 0.4) return;     // blink after a bump
      const look = p.look;
      const inAir = !p.onGround;
      const swing = Math.sin(p.runPhase) * 0.75;

      pen.save();
      pen.translate(p.x, p.y);
      pen.scale(KID_SIZE, KID_SIZE);
      pen.lineCap = "round";
      pen.lineJoin = "round";

      if (p.balloon > 0) {                                     // balloon
        pen.strokeStyle = "#555";
        pen.lineWidth = 1;
        pen.beginPath();
        pen.moveTo(10, -46);
        pen.quadraticCurveTo(18, -80, 14, -104);
        pen.stroke();
        pen.beginPath();
        pen.ellipse(14, -122, 15, 18, 0, 0, Math.PI * 2);
        fillAndInk("#ff4d6d", 2);
        pen.fillStyle = "rgba(255, 255, 255, 0.6)";
        pen.beginPath();
        pen.ellipse(9, -128, 4, 6, -0.4, 0, Math.PI * 2);
        pen.fill();
      }
      if (p.skate > 0 && !sliding) {                           // skateboard
        roundRect(-22, -5, 44, 6, 3);
        fillAndInk("#e63946", 2);
        pen.fillStyle = INK;
        pen.beginPath();
        pen.arc(-13, 3, 3.5, 0, Math.PI * 2);
        pen.arc(13, 3, 3.5, 0, Math.PI * 2);
        pen.fill();
      }
      if (sliding) {                                           // lean back and slide!
        pen.translate(14, 0);
        pen.rotate(-1.25);
      }
      if (p.skate > 0 && !sliding) pen.translate(0, -6);

      // draws a limb as a thick line with a dark outline
      const limb = function (points, color, width) {
        for (const pass of [[INK, width + 3], [color, width]]) {
          pen.strokeStyle = pass[0];
          pen.lineWidth = pass[1];
          pen.beginPath();
          pen.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i++) pen.lineTo(points[i][0], points[i][1]);
          pen.stroke();
        }
      };

      // legs and sneakers
      const legs = inAir ? [0.9, -0.5] : (p.skate > 0 || sliding ? [0.2, -0.2] : [swing, -swing]);
      legs.forEach(function (angle, i) {
        const kneeX = Math.sin(angle) * 11;
        const footX = Math.sin(angle) * 19 + (inAir ? -4 : 0);
        const footY = inAir ? -6 : -Math.max(0, Math.cos(angle) * 0) - 2;
        limb([[0, -22], [kneeX, -12], [footX, footY]], look.skin, 5);
        roundRect(footX - 4, footY - 3, 12, 6, 3);
        fillAndInk(look.shoes, 2);
        pen.fillStyle = "white";
        pen.fillRect(footX - 3, footY + 1, 10, 1.5);
        if (i === 0) {                                         // shorts go over the first leg
          roundRect(-9, -31, 18, 12, 3);
          fillAndInk(look.shorts, 2);
        }
      });
      // backpack
      roundRect(-17, -47, 9, 17, 3);
      fillAndInk(look.pack, 2);
      // back arm
      limb([[-2, -42], [-2 - Math.sin(swing) * 10, inAir ? -54 : -30]], look.skin, 4.5);
      // shirt (with a star on it)
      roundRect(-10, -48, 21, 20, 5);
      fillAndInk(look.shirt, 2.5);
      pen.fillStyle = "rgba(255, 255, 255, 0.9)";
      starPath(1, -38, 4.5, 2);
      pen.fill();
      pen.strokeStyle = INK;                                   // backpack strap
      pen.lineWidth = 2;
      pen.beginPath();
      pen.moveTo(-8, -46);
      pen.lineTo(-3, -31);
      pen.stroke();
      // front arm holding the magnifying glass
      const handX = 15;
      const handY = inAir ? -53 : -39 + Math.sin(p.runPhase * 2) * 2;
      limb([[4, -43], [handX, handY]], look.skin, 4.5);
      pen.strokeStyle = "#5d4037";
      pen.lineWidth = 3.5;
      pen.beginPath();
      pen.moveTo(handX, handY);
      pen.lineTo(handX + 6, handY - 6);
      pen.stroke();
      const lens = pen.createRadialGradient(handX + 9, handY - 13, 1, handX + 11, handY - 11, 8);
      lens.addColorStop(0, "rgba(255, 255, 255, 0.95)");
      lens.addColorStop(1, "rgba(150, 215, 255, 0.55)");
      pen.beginPath();
      pen.arc(handX + 11, handY - 11, 7.5, 0, Math.PI * 2);
      pen.fillStyle = lens;
      pen.fill();
      pen.strokeStyle = INK;
      pen.lineWidth = 2.5;
      pen.stroke();
      // head
      pen.beginPath();
      pen.arc(2, -59, 11.5, 0, Math.PI * 2);
      fillAndInk(look.skin, 2.5);
      pen.beginPath();                                         // ear
      pen.arc(-6, -58, 3.5, 0, Math.PI * 2);
      fillAndInk(look.skin, 2);
      // messy hair
      pen.beginPath();
      pen.moveTo(-10, -60);
      pen.quadraticCurveTo(-10, -72, 0, -73);
      pen.lineTo(-2, -79);
      pen.lineTo(4, -73);
      pen.lineTo(6, -80);
      pen.lineTo(9, -72);
      pen.quadraticCurveTo(14, -70, 13, -63);
      pen.quadraticCurveTo(6, -67, -1, -64);
      pen.quadraticCurveTo(-6, -62, -10, -60);
      pen.closePath();
      fillAndInk(look.hair, 2);
      // big curious eye, raised eyebrow, rosy cheek and a smile
      pen.fillStyle = "white";
      pen.beginPath();
      pen.ellipse(7.5, -58.5, 3.8, 4.5, 0, 0, Math.PI * 2);
      pen.fill();
      pen.strokeStyle = INK;
      pen.lineWidth = 1.2;
      pen.stroke();
      pen.fillStyle = INK;
      pen.beginPath();
      pen.arc(8.8, -59, 2.1, 0, Math.PI * 2);
      pen.fill();
      pen.fillStyle = "white";
      pen.beginPath();
      pen.arc(9.6, -60, 0.8, 0, Math.PI * 2);
      pen.fill();
      pen.strokeStyle = look.hair;
      pen.lineWidth = 1.8;
      pen.beginPath();
      pen.moveTo(4, -65.5);
      pen.quadraticCurveTo(7, -68, 11, -66.5);
      pen.stroke();
      pen.fillStyle = "rgba(255, 120, 120, 0.4)";
      pen.beginPath();
      pen.ellipse(5, -53.5, 2.8, 1.8, 0, 0, Math.PI * 2);
      pen.fill();
      pen.strokeStyle = "#5a2d1a";
      pen.lineWidth = 1.6;
      pen.beginPath();
      pen.arc(9, -54.5, 3, 0.15 * Math.PI, 0.85 * Math.PI);
      pen.stroke();
      if (p.helmet > 0) {                                      // helmet
        pen.beginPath();
        pen.arc(2, -62, 13.5, Math.PI * 1.05, Math.PI * 1.95);
        pen.closePath();
        fillAndInk("rgba(125, 249, 255, 0.9)", 2);
      }
      pen.restore();

      if (playerCount === 2) {
        pen.font = font(13, 700);
        pen.textAlign = "center";
        pen.textBaseline = "bottom";
        outlinedText(p === players[0] ? "P1" : "P2", p.x + 2, p.y - 104, "white");
      }
    }

    // text with a dark outline, so it shows up on any sky
    function outlinedText(text, x, y, color) {
      pen.strokeStyle = "rgba(20, 18, 40, 0.85)";
      pen.lineWidth = 4;
      pen.lineJoin = "round";
      pen.strokeText(text, x, y);
      pen.fillStyle = color;
      pen.fillText(text, x, y);
    }

    // a dark see-through rounded box for the scoreboard
    function pill(x, y, w, h) {
      roundRect(x, y, w, h, h / 2);
      pen.fillStyle = "rgba(15, 18, 45, 0.55)";
      pen.fill();
    }

    function drawButton(b, label, filled) {
      pen.fillStyle = "rgba(0, 0, 0, 0.35)";                   // button shadow
      roundRect(b.x + 3, b.y + 4, b.width, b.height, 12);
      pen.fill();
      roundRect(b.x, b.y, b.width, b.height, 12);
      if (filled) {
        const g = pen.createLinearGradient(0, b.y, 0, b.y + b.height);
        g.addColorStop(0, "#ffe27a");
        g.addColorStop(1, "#ffb703");
        pen.fillStyle = g;
      } else {
        pen.fillStyle = "rgba(255, 255, 255, 0.1)";
      }
      pen.fill();
      pen.strokeStyle = filled ? "#ffe9a8" : "#8a8fb0";
      pen.lineWidth = 2;
      pen.stroke();
      pen.fillStyle = filled ? "#1d2340" : "white";
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillText(label, b.x + b.width / 2, b.y + b.height / 2 + 1);
    }

    function drawButtons() {
      pen.font = font(21, 700);
      for (const b of buttons) drawButton(b, b.label, true);
    }

    function drawDifficultyButtons() {
      pen.font = font(17, 700);
      for (const b of difficultyButtons) drawButton(b, DIFFICULTIES[b.name].label, b.name === difficulty);
    }

    function drawLeaderboard(top) {
      pen.textBaseline = "middle";
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = font(17, 700);
      pen.fillText((isOnline() ? "🌍 WORLD TOP 3 · " : "📱 TOP 3 ON THIS DEVICE · ") + settings().label, W / 2, top);
      const medals = ["🥇", "🥈", "🥉"];
      for (let i = 0; i < 3; i++) {
        const entry = board()[i];
        const y = top + 28 + i * 24;
        const isNew = entry && isJustAdded(entry);
        pen.font = font(18, isNew ? 700 : 500);
        pen.fillStyle = isNew ? "#ffd75e" : (entry ? "white" : "#8a8fb0");
        pen.textAlign = "left";
        const shownName = entry ? (isKidFriendly(entry.name) ? entry.name : "★★★") : "-----";
        pen.fillText(medals[i] + "  " + shownName, 125, y);
        pen.textAlign = "right";
        pen.fillText(entry ? String(entry.score) : "", 355, y);
      }
    }

    function drawOtherBests(y) {
      const parts = [];
      for (const name of DIFFICULTY_ORDER) {
        if (name === difficulty) continue;
        const list = onlineScores[name] || scores[name];
        const top = list[0];
        parts.push(DIFFICULTIES[name].label + ": " + (top && isKidFriendly(top.name) ? top.name + " " + top.score : "—"));
      }
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "#c7cbe6";
      pen.font = font(13, 500);
      pen.fillText("#1 on " + parts.join("   ·   "), W / 2, y);
    }

    function drawPlayingAs() {
      if (!names[0]) return;
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "white";
      pen.font = font(16, 500);
      const who = playerCount === 2 && names[1] ? names[0] + " & " + names[1] : names[0];
      pen.fillText("👤 Playing as " + who, W / 2, 506);
      pen.font = font(15, 600);
      drawButton(changeNameButton, "✏️ Change name", false);
    }

    // the dark card behind the menus
    function drawMenuCard() {
      pen.fillStyle = "rgba(8, 10, 32, 0.45)";
      pen.fillRect(0, 0, W, H);
      roundRect(14, 40, W - 28, 535, 20);
      pen.fillStyle = "rgba(20, 24, 62, 0.88)";
      pen.fill();
      pen.strokeStyle = "rgba(255, 215, 94, 0.7)";
      pen.lineWidth = 2;
      pen.stroke();
    }

    // the big title with a golden gradient
    function drawTitle(text, y, size) {
      pen.font = font(size, 700);
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.strokeStyle = "#1d1b2f";
      pen.lineWidth = 8;
      pen.strokeText(text, W / 2, y);
      const g = pen.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, "#fff3a0");
      g.addColorStop(1, "#ff9f1c");
      pen.fillStyle = g;
      pen.fillText(text, W / 2, y);
    }

    // the Curiosity Book on the start screen: found discoveries, and ❔ for the rest
    function drawBook(top) {
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillStyle = "#ffd75e";
      pen.font = font(15, 700);
      pen.fillText("📖 JAHAN'S CURIOSITY BOOK: " + bookCount() + " / " + DISCOVERIES.length, W / 2, top);
      DISCOVERIES.forEach(function (d, i) {
        const x = W / 2 + ((i % 8) - 3.5) * 32;
        const y = top + 26 + Math.floor(i / 8) * 28;
        roundRect(x - 13, y - 12, 26, 24, 7);
        pen.fillStyle = book[d.name] ? "rgba(" + RARITY[d.rarity].color + ", 0.22)" : "rgba(255, 255, 255, 0.06)";
        pen.fill();
        pen.font = "16px sans-serif";
        pen.globalAlpha = book[d.name] ? 1 : 0.35;
        pen.fillText(book[d.name] ? d.picture : "❔", x, y + 1);
        pen.globalAlpha = 1;
      });
    }

    function drawStartScreen() {
      drawMenuCard();
      drawBook(62);
      drawTitle("JAHAN DASH", 158, 50);
      pen.fillStyle = "white";
      pen.font = font(16, 500);
      pen.fillText("Curious Jahan explores Tiny Town. Jump, slide, discover!", W / 2, 198);
      drawDifficultyButtons();
      drawLeaderboard(290);
      drawOtherBests(386);
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = font(19, 700);
      pen.fillText("How many players?", W / 2, 408);
      drawButtons();
      drawPlayingAs();
    }

    function drawGameOverScreen() {
      drawMenuCard();
      drawTitle("GAME OVER", 96, 46);
      pen.fillStyle = "white";
      pen.font = font(20, 600);
      pen.textAlign = "center";
      pen.fillText(resultText(), W / 2, 138);
      const p = players[0];
      pen.font = font(16, 500);
      pen.fillStyle = "#cfd3ee";
      pen.fillText("🏃 " + Math.floor(teamStat("meters")) + " m    ⭐ " + teamStat("stars") + "    🔍 " + teamStat("found") +
        "    🎯 " + missionsDone + (missionsDone === 1 ? " mission" : " missions"), W / 2, 166);
      if (justAdded.length > 0) {
        const who = justAdded.map(function (e) { return e.name; }).join(" & ");
        pen.fillStyle = "#ffd75e";
        pen.font = font(20, 700);
        pen.fillText(newBest ? "🏆 NEW HIGH SCORE, " + justAdded[0].name + "!" : "🏆 " + who + " made the top 3!", W / 2, 198);
      } else if (!checkingScores && board().length >= 3) {            // so close!
        const needed = board()[2].score - Math.max(p.score, playerCount === 2 ? players[1].score : 0) + 1;
        if (needed > 0) {
          pen.fillStyle = "#ffb3c7";
          pen.font = font(17, 700);
          pen.fillText("Only " + needed + " more points to reach the top 3!", W / 2, 198);
        }
      }
      drawDifficultyButtons();
      drawLeaderboard(290);
      if (onlineNote) {
        pen.textAlign = "center";
        pen.fillStyle = "#ff8fc7";
        pen.font = font(13, 500);
        pen.fillText(onlineNote + " Saved on this device.", W / 2, 386);
      } else {
        drawOtherBests(386);
      }
      pen.textAlign = "center";
      pen.fillStyle = "#ffd75e";
      pen.font = font(19, 700);
      if (checkingScores) {
        pen.fillText("Checking the scoreboard…", W / 2, 408);
      } else {
        pen.fillText("Play again?", W / 2, 408);
        drawButtons();
        drawPlayingAs();
      }
    }

    function drawMessage(title, line) {
      pen.fillStyle = "rgba(8, 10, 32, 0.6)";
      pen.fillRect(0, 0, W, H);
      drawTitle(title, H / 2 - 30, 46);
      pen.fillStyle = "white";
      pen.font = font(19, 600);
      pen.fillText(line, W / 2, H / 2 + 22);
    }

    function drawHud() {
      // scores (top left)
      players.slice(0, playerCount).forEach(function (p, i) {
        const y = 10 + i * 30;
        let text = displayName(p) + ": " + p.score;
        if (playerCount === 2) text += p.alive ? "  ❤️" + p.lives : "  💥";
        pen.font = font(17, 700);
        const width = pen.measureText(text).width + 40;
        pill(10, y, width, 26);
        pen.beginPath();
        pen.arc(25, y + 13, 7, 0, Math.PI * 2);
        fillAndInk(p.look.shirt, 2);
        pen.fillStyle = "white";
        pen.textAlign = "left";
        pen.textBaseline = "middle";
        pen.fillText(text, 36, y + 14);
      });
      // distance (top middle)
      const meters = Math.floor(teamStat("meters")) + " m";
      pen.font = font(18, 700);
      const mw = pen.measureText(meters).width + 24;
      pill(W / 2 + 40 - mw / 2, 10, mw, 26);
      pen.fillStyle = "white";
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.fillText(meters, W / 2 + 40, 24);
      // hearts and best (top right)
      if (playerCount === 1) {
        const hearts = "❤️".repeat(Math.max(0, players[0].lives));
        pen.font = "15px sans-serif";
        const hw = Math.max(40, pen.measureText(hearts).width + 20);
        pill(W - 10 - hw, 10, hw, 26);
        pen.textAlign = "right";
        pen.fillText(hearts, W - 20, 24);
      }
      pen.font = font(13, 600);
      pen.textAlign = "right";
      outlinedText(settings().label + " · Best " + best, W - 14, 50);

      if (gameState === "playing" || gameState === "paused") {
        // the current mission, with a progress bar
        if (mission) {
          const y = playerCount === 2 ? 72 : 64;
          const done = Math.min(missionTarget(), Math.max(0, missionProgress()));
          pill(W / 2 - 130, y, 260, 34);
          pen.font = font(14, 600);
          pen.fillStyle = "#ffe9a8";
          pen.textAlign = "center";
          pen.fillText("🎯 " + mission.text + "   " + done + "/" + missionTarget(), W / 2, y + 12);
          roundRect(W / 2 - 110, y + 23, 220, 6, 3);
          pen.fillStyle = "rgba(255, 255, 255, 0.2)";
          pen.fill();
          roundRect(W / 2 - 110, y + 23, Math.max(6, 220 * done / missionTarget()), 6, 3);
          pen.fillStyle = "#7ae582";
          pen.fill();
        }
        // power-ups that are on, as little circles with a timer ring
        const active = [];
        for (const p of activePlayers()) {
          if (!p.alive) continue;
          for (const name of Object.keys(POWER_UPS)) {
            if (p[name] > 0) active.push({ picture: POWER_UPS[name].picture, left: p[name] / POWER_UPS[name].seconds });
          }
        }
        active.forEach(function (a, i) {
          const x = W / 2 - (active.length - 1) * 20 + i * 40;
          const y = playerCount === 2 ? 128 : 120;
          pen.beginPath();
          pen.arc(x, y, 16, 0, Math.PI * 2);
          pen.fillStyle = "rgba(15, 18, 45, 0.6)";
          pen.fill();
          pen.beginPath();
          pen.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * a.left);
          pen.strokeStyle = "#7df9ff";
          pen.lineWidth = 3;
          pen.stroke();
          pen.font = "16px sans-serif";
          pen.textAlign = "center";
          pen.textBaseline = "middle";
          pen.fillText(a.picture, x, y + 1);
        });
      }
    }

    function draw() {
      pen.setTransform(DPR, 0, 0, DPR, 0, 0);         // draw everything at full sharpness
      pen.save();
      if (shakeTime > 0) pen.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      drawScenery();

      for (const d of puffs) {                        // dust clouds
        pen.fillStyle = "rgba(225, 215, 195, " + 0.6 * (d.life / d.max) + ")";
        pen.beginPath();
        pen.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        pen.fill();
      }

      const playing = gameState === "playing" || gameState === "paused";
      if (playing) {
        for (const o of obstacles) drawObstacle(o);
        for (const item of items) drawItem(item);
        for (const p of activePlayers()) if (p.alive) drawKid(p);
      } else {
        // on the menus, Jahan runs in place on the sidewalk
        const p = players[0];
        p.x = 150;
        p.y = GROUND;
        p.onGround = true;
        p.sliding = 0;
        p.balloon = 0;
        p.skate = 0;
        p.helmet = 0;
        p.invincible = 0;
        p.runPhase += 0.12;
        drawKid(p);
      }

      for (const s of sparkles) {
        pen.globalAlpha = Math.max(0, s.life / s.max);
        pen.fillStyle = s.color;
        if (s.confetti) {
          pen.save();
          pen.translate(s.x, s.y);
          pen.rotate(s.spin);
          pen.fillRect(-s.size / 2, -s.size / 4, s.size, s.size / 2);
          pen.restore();
        } else {
          pen.beginPath();
          pen.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
          pen.fill();
        }
      }
      pen.globalAlpha = 1;
      pen.textAlign = "center";
      pen.textBaseline = "middle";
      pen.font = font(17, 700);
      for (const word of popups) {
        pen.globalAlpha = Math.max(0, Math.min(1, word.life));
        outlinedText(word.text, word.x, word.y, word.color);
      }
      pen.globalAlpha = 1;
      pen.restore();

      drawHud();

      // controls reminder
      pen.font = font(14, 500);
      pen.textAlign = "center";
      pen.textBaseline = "bottom";
      let hint;
      if (gameState === "start" || gameState === "gameover") {
        hint = touchScreen ? "Tap a button to start" : "← → difficulty    1 / 2: players    N: change name";
      } else if (touchScreen) {
        hint = playerCount === 2 ? "Left side: P1   Right side: P2   Tap = jump, swipe down = slide" : "Tap = jump (tap again in the air!)   Swipe down = slide";
      } else {
        hint = playerCount === 2 ? "P1: Space/W jump, S slide    P2: ↑ jump, ↓ slide" :
          "Space/↑ jump (twice = double jump)   ↓ slide   P pause   M sound";
      }
      outlinedText(hint, W / 2, H - 8, "#eef0ff");

      if (bannerTimer > 0 && gameState === "playing") {
        const pop = Math.min(1, (1.8 - bannerTimer) * 6);         // pops in
        pen.save();
        pen.globalAlpha = Math.min(1, bannerTimer);
        pen.translate(W / 2, 210);
        pen.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
        pen.translate(-W / 2, -210);
        drawTitle(bannerText, 210, 34);
        if (bannerSub) {
          pen.font = font(17, 700);
          outlinedText(bannerSub, W / 2, 246, "white");
        }
        pen.restore();
      }

      if (gameState === "start") drawStartScreen();
      if (gameState === "paused") drawMessage("PAUSED", touchScreen ? "Tap to keep playing" : "Press P or click to keep playing");
      if (gameState === "gameover") drawGameOverScreen();
    }

    function resultText() {
      if (playerCount === 1) return "You scored " + players[0].score + " points";
      const p1 = players[0].score;
      const p2 = players[1].score;
      if (p1 > p2) return displayName(players[0]) + " wins, " + p1 + " to " + p2 + "!";
      if (p2 > p1) return displayName(players[1]) + " wins, " + p2 + " to " + p1 + "!";
      return "It's a tie, " + p1 + " to " + p2 + "!";
    }

    // ---------------------------------------------------------------
    // 6. GAME LOOP
    // ---------------------------------------------------------------
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    for (const name of DIFFICULTY_ORDER) loadOnlineScores(name);
    lastOnlineCheck = 0;
    lastAllCheck = 0;

    requestAnimationFrame(loop);
  </script>
</body>
</html>
